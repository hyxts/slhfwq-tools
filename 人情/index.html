<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>礼金管理系统</title>
<link rel="manifest" href="/renqing/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f8fafc">
<link rel="apple-touch-icon" href="/renqing/icon-192.svg">
<link rel="icon" type="image/svg+xml" href="/renqing/icon-512.svg">
<style>
:root{--primary:#ef4444;--bg:#f0f2f5;--card-bg:#ffffff;--text:#1e293b;--text-secondary:#64748b;--border:#e2e8f0;--shadow:0 2px 8px rgba(0,0,0,.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f0f2f5;color:#1e293b;min-height:100vh;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);padding-top:env(safe-area-inset-top);padding-bottom:calc(16px + env(safe-area-inset-bottom))}
body.modal-open{overflow:hidden;position:fixed;width:100%}
/* 顶部导航 */
header{background:#ffffff;border-bottom:1px solid #e2e8f0;padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:100;box-shadow:0 1px 3px rgba(0,0,0,.04)}
header h1{font-size:18px;font-weight:600;letter-spacing:2px;color:#1e293b}
nav{display:flex;gap:0}
nav button{padding:14px 20px;border:none;background:none;font-size:14px;color:#64748b;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;font-family:inherit}
nav button:hover{color:#1e293b;background:#f1f5f9}
nav button.active{color:#4f46e5;border-bottom-color:#4f46e5;font-weight:600}
/* 主容器 */
main{max-width:1100px;margin:0 auto;padding:24px 20px}
.pg{display:none}
.pg.active{display:block}
/* 卡片 */
.card{background:#ffffff;border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid #e2e8f0}
.card-title{font-size:15px;font-weight:600;color:#1e293b;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center;gap:8px}
/* 事件详情标题防止文字撑爆按钮 */
#evtDetail .card-title > span:first-child{min-width:0;flex-shrink:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-title .btn-group{flex-shrink:0}
/* 按钮 */
.btn{padding:8px 16px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;cursor:pointer;background:#ffffff;color:#1e293b;font-family:inherit;transition:all .15s}
.btn:hover{background:#f1f5f9;border-color:#9ca3af}
.btn.primary{background:#4f46e5;color:#fff;border-color:#4f46e5}
.btn.primary:hover{background:#4338ca}
.btn.danger{color:#ef4444;border-color:rgba(239,68,68,.3)}
.btn.danger:hover{background:rgba(239,68,68,.08)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn-group{display:flex;gap:8px;flex-wrap:wrap}
/* 表单 */
.fgroup{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fgroup input,.fgroup select{padding:8px 12px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;font-family:inherit;color:#1e293b;background:#ffffff;min-width:0;text-align:center}
.fgroup input:focus,.fgroup select:focus{outline:none;border-color:#6366f1;background:#ffffff}
.fgroup input[type="date"]{width:138px}
.fgroup input[name="name"]{width:180px;flex:1;max-width:220px}
.fgroup input[name="amount"]{width:150px}
.fgroup input[name="note"]{width:140px;max-width:140px}
.fgroup select{width:90px}
/* 表格 */
.t-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
table thead th{padding:10px 12px;text-align:center;font-size:12px;color:#64748b;border-bottom:2px solid #e2e8f0;white-space:nowrap;font-weight:500}
table tbody td{padding:9px 12px;font-size:13px;border-bottom:1px solid #f1f5f9;vertical-align:middle;text-align:center}
table tbody tr:hover{background:#f8fafc}
table tbody tr.row-locked{opacity:.6}
td.amt{font-weight:600;color:#1e293b}
td.num{text-align:center}
td.act{white-space:nowrap}
/* 年度标签 */
.ytabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.ytabs span{padding:6px 14px;background:#f1f5f9;border-radius:16px;font-size:13px;cursor:pointer;color:#64748b;border:1px solid transparent;transition:all .15s}
.ytabs span:hover{color:#1e293b;border-color:#cbd5e1}
.ytabs span.on{background:#4f46e5;color:#fff;font-weight:600}
.arch-link{display:inline-block;padding:6px 14px;font-size:12px;color:#6366f1;text-decoration:none;border:1px dashed #cbd5e1;border-radius:16px;transition:all .15s}
.arch-link:hover{color:#4f46e5;border-color:#6366f1;background:#f1f5f9}
/* 事件选择器 */
.evt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.evt-item{padding:14px;background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;cursor:pointer;transition:all .15s}
.evt-item:hover{border-color:#6366f1;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.evt-item.selected{border-color:#4f46e5;background:#eef2ff}
.evt-item .ename{font-size:14px;font-weight:600;margin-bottom:4px}
.evt-item .emeta{font-size:12px;color:#64748b;display:flex;gap:12px}
.evt-item .etotal{font-size:16px;font-weight:700;color:#1e293b;margin-top:6px}
/* 页导航 */
.batch-bar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.batch-bar span{padding:6px 12px;background:#f1f5f9;border-radius:6px;font-size:13px;cursor:pointer;border:1px solid transparent;transition:all .15s}
.batch-bar span:hover{border-color:#cbd5e1}
.batch-bar span.on{background:#4f46e5;color:#fff;font-weight:600}
/* 礼薄页面 (页) */
.gift-page{background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden}
.gift-page .page-header{background:#f8fafc;padding:10px 16px;font-size:13px;color:#64748b;border-bottom:1px solid #e2e8f0;display:flex;justify-content:space-between;align-items:center}
.gift-page table thead th{background:#f8fafc}
/* 可编辑录入表单 */
.page-form table td{padding:4px 8px}
.page-form input{width:100%;padding:6px 8px;border:1px solid #d1d5db;border-radius:4px;font-size:13px;font-family:inherit;color:#1e293b;background:#ffffff;text-align:center}
.page-form input:focus{outline:none;border-color:#6366f1;background:#ffffff;box-shadow:0 0 0 2px rgba(79,70,229,.1)}
.page-form input::placeholder{color:#cbd5e1}
.row-empty td{background:#fafafa}
/* 模糊搜索下拉 */
.ac-dd{position:fixed;z-index:300;background:#ffffff;border:1px solid #d1d5db;border-radius:6px;max-height:180px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.1);display:none}
.ac-dd.show{display:block}
.ac-dd .ac-item{padding:8px 12px;font-size:13px;cursor:pointer;color:#1e293b;white-space:nowrap}
.ac-dd .ac-item:hover,.ac-dd .ac-item.active{background:#f1f5f9}
/* 数据卡片 */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;text-align:center}
.stat-card .slabel{font-size:12px;color:#64748b;margin-bottom:6px}
.stat-card .svalue{font-size:24px;font-weight:700;color:#1e293b}
.stat-card.sub .svalue{font-size:18px;color:#64748b}
/* 弹窗 */
.modal-mask{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.25);z-index:200;justify-content:center;align-items:center}
.modal-mask.show{display:flex}
.modal-box{background:#ffffff;border-radius:10px;padding:24px;min-width:360px;max-width:500px;box-shadow:0 8px 30px rgba(0,0,0,.12);border:1px solid #e2e8f0}
.modal-box h3{font-size:16px;font-weight:600;margin-bottom:16px;color:#1e293b}
.modal-box .fgroup{margin-bottom:12px;display:flex;flex-direction:column;align-items:stretch;gap:0}
.modal-box .fgroup label{font-size:12px;color:#64748b;margin-bottom:4px}
.modal-box .fgroup input,.modal-box .fgroup select{width:100%}
.modal-box .btn-row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
/* 提示 */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:10px 24px;background:#4f46e5;color:#fff;border-radius:8px;font-size:13px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;width:max-content;max-width:90vw}
.toast.show{opacity:1}
.toast.err{background:#c0392b}
/* 加载状态 */
.loading-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(245,244,240,.7);z-index:9999;display:none;justify-content:center;align-items:center}
.loading-overlay.show{display:flex}
.loading-spinner{border:3px solid #e0dbd0;border-top:3px solid #2c3e50;border-radius:50%;width:32px;height:32px;animation:spin .8s linear infinite}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
/* 移动端 */
@media(max-width:768px){
  body{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
  /* 顶部导航 - 隐藏按钮，保留标题 */
  header{flex-direction:column;height:auto;padding:8px 10px;gap:6px}
  header h1{font-size:14px;letter-spacing:1px}
  nav{display:none}
  /* 底部导航 - 仅在移动端显示 */
  .bottom-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#ffffff;justify-content:space-around;padding:8px 0 calc(8px + env(safe-area-inset-bottom));border-top:1px solid #e2e8f0;z-index:100;box-shadow:0 -1px 6px rgba(0,0,0,.06)}
  .bottom-nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;border:none;background:none;font-size:9px;color:#64748b;cursor:pointer;min-height:44px;width:auto;margin:0;border-radius:0}
  .bottom-nav button.active{color:#f87171}
  main{padding:12px 8px;max-width:100%}
  .card{padding:12px;margin-bottom:10px;border-radius:6px}

  /* 表单控件 */
  .fgroup{flex-direction:column;align-items:stretch;gap:8px}
  .fgroup input,.fgroup select,.fgroup .btn{width:100%!important;max-width:none!important;min-width:0!important;box-sizing:border-box!important}
  .fgroup input,.fgroup select{padding:10px 12px;font-size:16px}
  .fgroup .btn{padding:12px;font-size:16px;text-align:center}
  .date-row{display:flex;gap:6px}
  .date-row select{flex:1;min-width:0!important;padding:10px 6px;font-size:16px}

  /* 按钮 */
  .btn{padding:8px 14px;font-size:14px}
  .btn.sm{padding:6px 10px;font-size:13px}
  .btn-group{gap:6px}

  /* 统计卡片 - 两列网格 */
  .stat-row{grid-template-columns:1fr 1fr;gap:8px}
  .stat-card{padding:12px 8px}
  .stat-card .svalue{font-size:20px}
  .stat-card.sub .svalue{font-size:16px}

  /* 年度标签 */
  .ytabs{gap:4px;margin-bottom:12px}
  .ytabs span{padding:5px 10px;font-size:12px}

  /* 表格 - 水平滚动 */
  .t-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -12px;padding:0 12px}
  table{font-size:13px;min-width:500px}
  table thead th{padding:8px 8px;font-size:11px}
  table tbody td{padding:7px 8px;font-size:12px}
  td.act{white-space:nowrap}

  /* 事件选择卡片 */
  .evt-grid{grid-template-columns:1fr;gap:8px}
  .evt-item{padding:12px}

  /* 事件详情 - 标题栏按钮竖向堆叠 */
  #evtDetail .card-title{flex-direction:column;align-items:stretch;gap:8px}
  #evtDetail .card-title > span:first-child{white-space:normal;overflow:visible;text-overflow:clip}
  #evtDetail .card-title .btn-group{justify-content:flex-end;flex-shrink:1}
  #evtDetail .card-title .btn-group .btn{height:38px;min-width:44px;font-size:13px}

  /* 礼薄页面 - 可编辑表单表格优化 */
  .gift-page{border-radius:6px}
  .gift-page .page-header{flex-wrap:wrap;gap:6px;padding:8px 10px;font-size:12px}
  .page-form{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .page-form table{min-width:350px;table-layout:fixed;width:100%}
  .page-form table thead th{font-size:11px;padding:6px 4px}
  .page-form table tbody td{padding:4px 4px}
  .page-form table th:nth-child(1){width:30px}
  .page-form table th:nth-child(2){width:38%}
  .page-form table th:nth-child(3){width:28%}
  .page-form table th:nth-child(4){width:22%}
  .page-form table th:nth-child(5){width:30px}
  .page-form input{padding:8px 4px;font-size:16px;width:100%!important;box-sizing:border-box!important}
  .page-form .btn.sm{padding:4px 6px;font-size:12px;min-width:28px}

  /* 页导航 */
  .batch-bar{gap:4px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;flex-wrap:nowrap}
  .batch-bar span{padding:5px 8px;font-size:12px;white-space:nowrap;flex-shrink:0}

  /* 弹窗 */
  .modal-box{min-width:0;width:92vw;max-width:92vw;padding:16px;margin:0 auto;border-radius:8px}
  .modal-mask{padding:10px}
  .modal-box h3{font-size:15px;margin-bottom:12px}
  .modal-box .fgroup{margin-bottom:10px}
  .modal-box .fgroup label{font-size:11px}
  .modal-box .fgroup input,.modal-box .fgroup select{padding:10px 12px;font-size:16px}
  .modal-box .btn-row{flex-direction:column-reverse;gap:8px}
  .modal-box .btn-row .btn{width:100%;padding:12px;font-size:15px;text-align:center;height:46px}

  /* 统计页搜索框全宽 */
  #sSearchName{width:100%!important;max-width:none!important}
  /* 统计表格/视图间距 */
  #sPersonDetail .t-wrap{margin:0 -12px;padding:0 12px}
  /* 人员详情头信息的响应式 */

  /* 人员查询详情 - 摘要行改为纵向 */
  #sPersonDetail .stat-row > div[style*="background"] > div[style*="display:flex"]{
    flex-direction:column;gap:6px
  }
  #sPersonDetail .stat-row > div[style*="background"] > div[style*="display:flex"] span{font-size:13px}

  /* 数据总览表格 */
  #sBalTable td,#sEvtTable td{padding:7px 6px}

  /* toast 避开刘海/HomeIndicator */
  .toast{top:auto;max-width:90vw;padding:10px 18px;font-size:13px;bottom:calc(20px + env(safe-area-inset-bottom))}
}
/* PC端 */
@media(min-width:769px){
  .bottom-nav{display:none}
  main{max-width:none;margin:0 auto;padding:16px 24px}
  body{background:#f0f2f5}
}
</style>
</head>
<body>

<header>
  <div style="display:flex;align-items:center;gap:8px">
    <a href="/nav" title="返回导航" style="color:#64748b;text-decoration:none;font-size:20px;font-weight:400;line-height:1;display:flex;align-items:center">←</a>
    <h1>礼金管理系统</h1>
  </div>
  <nav id="topNav">
    <button data-pg="daily" class="active">日常随礼</button>
    <button data-pg="stats">数据总览</button>
    <button data-pg="event">事件收礼</button>
    <button onclick="location.href='/renqing/archive'" style="border-bottom:none">归档库</button>
  </nav>
</header>
<div class="bottom-nav" id="bottomNav">
  <button data-pg="daily" class="active">随礼录入</button>
  <button data-pg="stats">总览</button>
  <button data-pg="event">收礼</button>
  <button onclick="location.href='/renqing/archive'">归档库</button>
</div>

<main class="pg active" id="pg-daily">
  <!-- 日常随礼 - 快速录入 -->
  <div class="card">
    <div class="card-title">录入随礼</div>
    <div class="fgroup" id="dailyForm">
      <div class="date-row"><label style="display:block;font-size:11px;color:#94a3b8;margin-bottom:2px">日期</label>
        <select id="dYear"></select><select id="dMonth"></select><select id="dDay"></select>
      </div>
      <div><label style="display:block;font-size:11px;color:#94a3b8;margin-bottom:2px">姓名</label><input type="text" id="dName" name="name" autocomplete="off"></div>
      <div><label style="display:block;font-size:11px;color:#94a3b8;margin-bottom:2px">金额</label><input type="number" id="dAmt" name="amount" step="0.01"></div>
      <div><label style="display:block;font-size:11px;color:#94a3b8;margin-bottom:2px">备注</label><input type="text" id="dNote" name="note"></div>
      <button class="btn primary" onclick="saveDaily()">保存</button>
    </div>
  </div>

  <!-- 年度筛选 -->
  <div id="dYearTabs" class="ytabs"></div>

  <!-- 年度统计 -->
  <div class="stat-row" id="dSummary"></div>

  <!-- 记录表格 -->
  <div class="card">
    <div class="card-title">
      <span>随礼记录</span>
      <div><button class="btn sm" id="dLockBtn" onclick="toggleDailyLock()">锁定</button>
      <button class="btn sm" onclick="exportCSV()">导出CSV</button></div>
    </div>
    <div class="t-wrap">
      <table><thead><tr><th>日期</th><th>姓名</th><th>金额</th><th>备注</th><th style="width:100px">操作</th></tr></thead>
        <tbody id="dList"></tbody>
      </table>
    </div>
  </div>
</main>

<main class="pg" id="pg-event">
  <!-- 当前编辑中的事件 -->
  <div class="card" id="unarchivedCard" style="display:none">
    <div class="card-title" style="cursor:pointer">
      <span>未归档事件 <span id="unarchivedToggleIcon" style="font-size:12px;color:#64748b">[-]</span></span>
      <button class="btn primary sm" onclick="event.stopPropagation();showEvtModal()">新增事件</button>
    </div>
    <div class="evt-grid" id="unarchivedGrid"></div>
  </div>

  <!-- 选中事件的详情 -->
  <div id="evtDetail" style="display:none">
    <!-- 事件头部信息 -->
    <div class="card">
      <div class="card-title">
        <span id="evtTitle"></span>
        <div class="btn-group">
          <button class="btn sm" id="evtArchiveBtn" onclick="toggleArchive()">归档</button>
          <button class="btn sm" id="evtLockBtn" onclick="toggleLock()">锁定</button>
          <button class="btn sm" onclick="editEvt()">编辑事件</button>
          <button class="btn sm danger" onclick="deleteEvt()">删除</button>
        </div>
      </div>
      <div class="stat-row" id="evtStats"></div>
      <!-- 页导航 -->
      <div class="batch-bar" id="batchNav"></div>
      <!-- 礼薄页面 -->
      <div class="gift-page" id="giftPage"></div>
    </div>
  </div>
</main>

<main class="pg" id="pg-stats">
  <!-- 全局数据 -->
  <div class="stat-row" id="sSummary"></div>

  <!-- 人员查找 -->
  <div class="card">
    <div class="card-title">
      <span>人员往来查询</span>
    </div>
    <div class="fgroup" style="margin-bottom:14px">
      <label style="font-size:11px;color:#94a3b8;margin-right:4px">搜索</label><input type="text" id="sSearchName" style="width:220px">
    </div>
    <div id="sPersonDetail"></div>
  </div>

  <!-- 各事件汇总 -->
  <div class="card">
    <div class="card-title">各事件汇总</div>
    <div class="t-wrap">
      <table><thead><tr><th>事件名称</th><th>类型</th><th>记录数</th><th>总金额</th></tr></thead>
        <tbody id="sEvtTable"></tbody>
      </table>
    </div>
  </div>

  <!-- 人情往来 -->
  <div class="card">
    <div class="card-title">人情往来明细</div>
    <div class="t-wrap">
      <table><thead><tr><th style="text-align:center">姓名</th><th style="text-align:center">收到</th><th style="text-align:center">送出</th><th style="text-align:center">净额</th><th style="text-align:center">说明</th></tr></thead>
        <tbody id="sBalTable"></tbody>
      </table>
    </div>
  </div>
</main>

<!-- 弹窗 -->
<div class="modal-mask" id="modal">
  <div class="modal-box" id="modalBox"></div>
</div>

<!-- 提示 -->
<div class="toast" id="toast"></div>
<div class="loading-overlay" id="loadingOverlay"><div class="loading-spinner"></div></div>

<script>
const API='/api/renqing';
const $=id=>document.getElementById(id);

// ---- 日期选择器工具 ----
function initDateSelects(){
  const yy=$('dYear'),mm=$('dMonth'),dd=$('dDay');
  const now=new Date();
  for(let y=now.getFullYear()-5;y<=now.getFullYear()+1;y++)yy.innerHTML+=`<option value="${y}">${y}年</option>`;
  for(let m=1;m<=12;m++)mm.innerHTML+=`<option value="${m}">${m}月</option>`;
  function fillDays(){
    const y=parseInt(yy.value),m=parseInt(mm.value);
    const last=new Date(y,m,0).getDate();
    dd.innerHTML='';
    for(let d=1;d<=last;d++)dd.innerHTML+=`<option value="${d}">${d}日</option>`;
  }
  yy.addEventListener('change',fillDays);
  mm.addEventListener('change',fillDays);
  yy.value=now.getFullYear();mm.value=now.getMonth()+1;fillDays();dd.value=now.getDate();
}
function getDate(){
  return $('dYear').value+'-'+String($('dMonth').value).padStart(2,'0')+'-'+String($('dDay').value).padStart(2,'0');
}
function setDate(v){
  if(!v)return;
  const p=v.split('-');
  if(p.length===3){$('dYear').value=p[0];$('dMonth').value=parseInt(p[1]);$('dYear').dispatchEvent(new Event('change'));$('dDay').value=parseInt(p[2]);}
}
</script>
<script src="/renqing/common.js"></script>
<script>
// ==================== 导航 ====================
let curPg='daily';
document.querySelectorAll('nav button, .bottom-nav button').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.pg').forEach(p=>p.classList.remove('active'));
    document.querySelectorAll('nav button, .bottom-nav button').forEach(n=>n.classList.remove('active'));
    b.classList.add('active');
    // 同步选中状态到另一组导航
    const pg=b.dataset.pg;
    document.querySelectorAll('nav button[data-pg="'+pg+'"], .bottom-nav button[data-pg="'+pg+'"]').forEach(x=>x.classList.add('active'));
    curPg=pg;$('pg-'+curPg).classList.add('active');
    if(curPg==='daily')loadDaily();
    else if(curPg==='event')loadEvents();
    else loadStats();
  });
});
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))hideModal();});

// ==================== 日常随礼 ====================
let dailyEventId=null,dailyYear='',dailyRecords=[],dailyLocked=false;
acAttach($('dName'));
// 日常流水键盘导航：Enter 姓名→金额→备注→保存
$('dName').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!document.querySelector('.ac-dd.show')){e.preventDefault();$('dAmt').focus();}
});
$('dAmt').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!document.querySelector('.ac-dd.show')){e.preventDefault();$('dNote').focus();}
});
$('dNote').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!document.querySelector('.ac-dd.show')){e.preventDefault();saveDaily();}
});

async function loadDaily(){
  try{
    const evts=await apiGet('/events');
    const dailyEvt=evts.find(e=>e.event_type==='日常'||e.name==='流水');
    if(!dailyEvt){$('dYearTabs').innerHTML='';$('dSummary').innerHTML='';$('dList').innerHTML='<tr><td colspan="5" style="text-align:center;padding:20px;color:#64748b">暂无日常事件</td></tr>';return;}
    dailyEventId=dailyEvt.id;
    dailyLocked=dailyEvt.locked;
    $('dLockBtn').textContent=dailyLocked?'解锁':'锁定';

    const recs=await apiGet('/records?event_id='+dailyEventId);
    dailyRecords=recs.filter(r=>!r.direction||r.direction==='送');

    dailyYear=new Date().getFullYear().toString();
    renderYearTabs();
    renderDaily();
  }catch(e){$('dList').innerHTML='<tr><td colspan="5" style="text-align:center;padding:20px;color:#64748b">加载失败，请刷新重试</td></tr>';}
}

function renderYearTabs(){
  $('dYearTabs').innerHTML=`<span class="on">${dailyYear}年</span><a href="/renqing/archive" class="arch-link">查看往年归档 &gt;</a>`;
}

function renderDaily(){
  const recs=dailyRecords.filter(r=>r.date&&r.date.startsWith(dailyYear));
  const total=recs.reduce((s,r)=>s+(r.amount||0),0);
  $('dSummary').innerHTML=`
    <div class="stat-card"><div class="slabel">${dailyYear}年送出</div><div class="svalue">${fmtA(total)} 元</div></div>
    <div class="stat-card sub"><div class="slabel">记录数</div><div class="svalue">${recs.length} 条</div></div>
    <div class="stat-card sub"><div class="slabel">涉及人数</div><div class="svalue">${new Set(recs.map(r=>r.name)).size} 人</div></div>
    <div class="stat-card sub"><div class="slabel">平均</div><div class="svalue">${recs.length?fmtA(Math.round(total/recs.length)):0} 元</div></div>`;

  $('dList').innerHTML=recs.length?recs.map(r=>`<tr>
    <td>${fmtD(r.date)}</td><td>${escH(r.name)}</td><td class="amt">${fmtA(r.amount)}</td>
    <td style="color:#64748b">${escH(r.note||'')}</td>
    <td class="act">${dailyLocked?'':
      `<button class="btn sm" onclick="editDailyRec(${r.id})">编辑</button>
      <button class="btn sm danger" onclick="delRec(${r.id})">删除</button>`}</td></tr>`).join('')
    :'<tr><td colspan="5" style="text-align:center;padding:20px;color:#64748b">暂无记录</td></tr>';
}

async function saveDaily(){
  const name=$('dName').value.trim(),amt=parseFloat($('dAmt').value);
  if(!name||!amt||amt<=0){toast('请填写姓名和金额',1);return;}
  const rid=$('dName').dataset.rid;
  const body={event_id:dailyEventId,name,amount:amt,date:getDate(),note:$('dNote').value.trim(),direction:'送'};
  const url=rid?API+'/records/'+rid:API+'/records';
  const method=rid?'PUT':'POST';
  const res=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(res.ok){toast(rid?'已更新':'已保存');resetDailyForm();loadDaily();}
  else{const e=await res.json();toast(e.error||'保存失败',1);}
}

function resetDailyForm(){
  $('dName').value='';$('dAmt').value='';$('dNote').value='';delete $('dName').dataset.rid;
  const d=new Date();setDate(d.toISOString().slice(0,10));
}

async function editDailyRec(rid){
  const r=dailyRecords.find(x=>x.id===rid);if(!r)return;
  $('dName').value=r.name;$('dAmt').value=r.amount;$('dNote').value=r.note||'';
  setDate(r.date);$('dName').dataset.rid=rid;$('dName').focus();
}

async function delRec(rid){
  showConfirm('确定删除此记录？',async()=>{
    const res=await fetch(API+'/records/'+rid,{method:'DELETE'});
    if(res.ok){toast('已删除');if(curPg==='daily')loadDaily();else loadEventDetail();}
    else{const e=await res.json();toast(e.error||'删除失败',1);}
  });
}

async function exportCSV(){
  const url=API+'/export?event_id='+dailyEventId;window.open(url,'_blank');
}

// ==================== 事件收礼 ====================
let events=[],unarchivedEvts=[],selEvtId=null,selBatch=null,evtRecords=[],_gotoBatch=null,isUnarchivedMode=false,_pageDirty=false;

async function loadEvents(){
  try{
    const allEvts=await apiGet('/events');
    const nonDaily=allEvts.filter(e=>e.event_type!=='日常');
    events=nonDaily.filter(e=>e.archived);
    unarchivedEvts=nonDaily.filter(e=>!e.archived);
    renderEvtGrid();
    renderUnarchivedGrid();
    if(!selEvtId) return;
    const merged=[...events,...unarchivedEvts];
    const stillExists=merged.find(e=>e.id===selEvtId);
    if(stillExists)loadEventDetail();
    else{$('evtDetail').style.display='none';selEvtId=null;}
  }catch(e){toast('加载事件列表失败，请刷新重试',1);}
}

function renderEvtGrid(){/* 已归档事件移至归档库页面 */}

function renderUnarchivedGrid(){
  $('unarchivedCard').style.display='';
  $('unarchivedGrid').innerHTML=unarchivedEvts.length?unarchivedEvts.map(e=>`<div class="evt-item${e.id===selEvtId?' selected':''}${e.locked?' row-locked':''}" onclick="selectEvent(${e.id},true)">
    <div class="ename">${escH(e.name)}${e.locked?' <span style="font-size:11px;color:#f87171">[锁定]</span>':''}</div>
    <div class="emeta"><span>${escH(evtTypeLabel(e.event_type))}</span>${e.event_date?`<span>${e.event_date}</span>`:''}<span>${e.record_count}条</span></div>
    <div class="etotal">${fmtA(e.total_amount)} 元</div>
  </div>`).join(''):'';
}

async function selectEvent(eid,unarchived){
  selEvtId=eid;isUnarchivedMode=unarchived;selBatch=null;
  $('evtDetail').style.display='block';
  renderEvtGrid();
  renderUnarchivedGrid();
  loadEventDetail();
}

async function loadEventDetail(){
  const evt=(isUnarchivedMode?unarchivedEvts:events).find(e=>e.id===selEvtId);if(!evt)return;
  // 标题
  $('evtTitle').innerHTML=`${escH(evt.name)} <span style="font-size:12px;color:#64748b">(${escH(evtTypeLabel(evt.event_type))}${evt.event_date?' | '+evt.event_date:''})</span>`;
  $('evtLockBtn').textContent=evt.locked?'解锁':'锁定';
  $('evtArchiveBtn').textContent=evt.archived?'取消归档':'归档';

  // 并行加载记录和最新事件列表（分开捕获错误，一个失败不拖累另一个）
  let recs=[],allEvts=[];
  try{recs=await apiGet('/records?event_id='+selEvtId);}catch(e){}
  try{allEvts=await apiGet('/events');}catch(e){}
  evtRecords=recs;
  if(allEvts.length){
    const nonDaily=allEvts.filter(e=>e.event_type!=='日常');
    events=nonDaily.filter(e=>e.archived);
    unarchivedEvts=nonDaily.filter(e=>!e.archived);
    renderEvtGrid();
    renderUnarchivedGrid();
  }
  // 更新当前事件引用（在正确的列表中查找，找不到则用传入的evt兜底）
  const refreshed=(isUnarchivedMode?unarchivedEvts:events).find(e=>e.id===selEvtId)||evt;

  // 统计
  const total=evtRecords.reduce((s,r)=>s+(r.amount||0),0);
  const isDaily=(refreshed||evt).event_type==='日常'||(refreshed||evt).name==='流水';
  $('evtStats').innerHTML=`
    <div class="stat-card"><div class="slabel">${isDaily?'送出总额':'收到总额'}</div><div class="svalue">${fmtA(total)} 元</div></div>
    <div class="stat-card sub"><div class="slabel">记录数</div><div class="svalue">${evtRecords.length} 条</div></div>
    <div class="stat-card sub"><div class="slabel">涉及人数</div><div class="svalue">${new Set(evtRecords.map(r=>r.name)).size} 人</div></div>
    <div class="stat-card sub"><div class="slabel">页数</div><div class="svalue">${new Set(evtRecords.map(r=>r.batch)).size}</div></div>`;

  // 页导航
  const batches=[...new Set(evtRecords.map(r=>r.batch))].sort((a,b)=>a-b);
  if(_gotoBatch!==null){selBatch=_gotoBatch;_gotoBatch=null;}
  else if(!selBatch||!batches.includes(selBatch))selBatch=batches[batches.length-1]||1;
  const ps=(refreshed||evt).page_size||12;
  $('batchNav').innerHTML=batches.length?batches.map(b=>{
    const br=evtRecords.filter(r=>r.batch===b);
    const bTotal=br.reduce((s,r)=>s+(r.amount||0),0);
    return `<span class="${b===selBatch?'on':''}" onclick="selBatch=${b};renderBatchPage()">第${b}页 ${br.length}/${ps} · ${fmtA(bTotal)}</span>`;
  }).join(''):'<span style="color:#64748b">暂无记录</span>';

  renderBatchPage();
}

function markPageDirty(){_pageDirty=true;}

function renderBatchPage(){
  acCleanAll(); // 清理所有旧下拉框DOM
  _pageDirty=false; // 新页面无脏数据
  if(!selBatch){$('giftPage').innerHTML='<div style="text-align:center;padding:40px;color:#64748b">选择页面查看</div>';return;}
  const batchRecs=evtRecords.filter(r=>r.batch===selBatch);
  const sorted=batchRecs.sort((a,b)=>a.id-b.id);
  const evt=(isUnarchivedMode?unarchivedEvts:events).find(e=>e.id===selEvtId);
  const ps=evt?evt.page_size||12:12;
  const locked=evt&&evt.locked;
  const total=sorted.reduce((s,r)=>s+(r.amount||0),0);

  let html=`<div class="page-header"><span>第 ${selBatch} 页&nbsp;·&nbsp;${sorted.length}/${ps} 条 · ${fmtA(total)} 元</span>`;
  if(!locked){html+=`<span class="btn-group"><button class="btn primary sm" onclick="savePage()">保存</button><button class="btn primary sm" onclick="gotoNextPage()">翻页</button></span>`;}
  html+=`</div>`;

  if(locked){
    html+=`<div class="t-wrap"><table><thead><tr><th style="width:40px">序号</th><th>姓名</th><th style="width:100px">金额</th><th>备注</th><th style="width:80px">操作</th></tr></thead><tbody>`;
    for(let i=0;i<ps;i++){
      const r=sorted[i];
      if(r){
        html+=`<tr><td class="num" style="color:#64748b">${i+1}</td><td>${escH(r.name)}</td><td class="amt num">${fmtA(r.amount)}</td><td style="color:#64748b">${escH(r.note||'')}</td><td></td></tr>`;
      }else{
        html+=`<tr style="color:#ccc"><td class="num">${i+1}</td><td>---</td><td class="num">---</td><td>---</td><td></td></tr>`;
      }
    }
    html+=`</tbody></table></div>`;
  }else{
    html+=`<div class="page-form" id="pageForm"><table><thead><tr><th style="width:40px">序号</th><th style="width:220px">姓名</th><th style="width:180px">金额</th><th style="width:140px">备注</th><th style="width:60px"></th></tr></thead><tbody>`;
    for(let i=0;i<ps;i++){
      const r=sorted[i];
      const nk=`pn_${i}`;const ak=`pa_${i}`;const ntk=`pnt_${i}`;
      html+=`<tr ${r?'':'class="row-empty"'}>
        <td class="num" style="color:#64748b">${i+1}</td>
        <td><input type="text" id="${nk}" value="${r?escH(r.name):''}" class="pi-name" data-idx="${i}" data-rid="${r?r.id:''}" oninput="markPageDirty()"></td>
        <td><input type="number" id="${ak}" value="${r?r.amount:''}" step="0.01" class="pi-amt" data-idx="${i}" oninput="markPageDirty()"></td>
        <td><input type="text" id="${ntk}" value="${r?escH(r.note||''):''}" class="pi-note" data-idx="${i}" oninput="markPageDirty()"></td>
        <td>${r?`<button class="btn sm danger" onclick="delRec(${r.id})">删除</button>`:''}</td>
      </tr>`;
    }
    html+=`</tbody></table></div>`;
  }
  $('giftPage').innerHTML=html;
  if(!locked){
    // 键盘导航：Enter在同一行内依次聚焦(姓名→金额→备注)，备注按Enter跳到下一行姓名
    setTimeout(()=>{
      const inputs=$('pageForm').querySelectorAll('input');
      inputs.forEach((inp,i)=>{
        inp.addEventListener('keydown',(e)=>{
          if(e.key==='Enter'){
            if(document.querySelector('.ac-dd.show'))return;
            e.preventDefault();
            // 每3个一组(姓名/金额/备注)，判断是否当前行最后一列
            const col=(i%3);
            if(col<2 && i+1<inputs.length){inputs[i+1].focus();}
            else{
              // 备注列或最后一行：跳到下一行姓名，没有则翻页
              const nextRowStart=i+3-col;
              if(nextRowStart<inputs.length){inputs[nextRowStart].focus();}
              else{gotoNextPage();}
            }
          }
        });
      });
      document.querySelectorAll('.pi-name').forEach(inp=>acAttach(inp));
    },50);
  }
}

async function gotoNextPage(){
  await savePage(true);          // 仅当有变更时才保存
  selBatch=(selBatch||0)+1;
  _gotoBatch=selBatch;
  renderBatchPage();
}

async function loadEvtDataSilent(){
  try{
    evtRecords=await apiGet('/records?event_id='+selEvtId);
    let allEvts=[];
    try{allEvts=await apiGet('/events');}catch(e){}
    if(allEvts.length){
      const nonDaily=allEvts.filter(e=>e.event_type!=='日常');
      events=nonDaily.filter(e=>e.archived);
      unarchivedEvts=nonDaily.filter(e=>!e.archived);
      renderEvtGrid();
      renderUnarchivedGrid();
    }
    // 更新统计面板，在正确的列表中查找
    const evt=(isUnarchivedMode?unarchivedEvts:events).find(e=>e.id===selEvtId);
    if(evt){
      const total=evtRecords.reduce((s,r)=>s+(r.amount||0),0);
      const isDaily=evt.event_type==='日常'||evt.name==='流水';
      $('evtStats').innerHTML=`
        <div class="stat-card"><div class="slabel">${isDaily?'送出总额':'收到总额'}</div><div class="svalue">${fmtA(total)} 元</div></div>
        <div class="stat-card sub"><div class="slabel">记录数</div><div class="svalue">${evtRecords.length} 条</div></div>
        <div class="stat-card sub"><div class="slabel">涉及人数</div><div class="svalue">${new Set(evtRecords.map(r=>r.name)).size} 人</div></div>
        <div class="stat-card sub"><div class="slabel">页数</div><div class="svalue">${new Set(evtRecords.map(r=>r.batch)).size}</div></div>`;
      $('evtLockBtn').textContent=evt.locked?'解锁':'锁定';
      $('evtArchiveBtn').textContent=evt.archived?'取消归档':'归档';
      const batches=[...new Set(evtRecords.map(r=>r.batch))].sort((a,b)=>a-b);
      if(_gotoBatch!==null){selBatch=_gotoBatch;_gotoBatch=null;}
      else if(!batches.includes(selBatch))selBatch=batches[batches.length-1]||1;
      const ps=evt.page_size||12;
      $('batchNav').innerHTML=batches.length?batches.map(b=>{
        const br=evtRecords.filter(r=>r.batch===b);
        const bTotal=br.reduce((s,r)=>s+(r.amount||0),0);
        return `<span class="${b===selBatch?'on':''}" onclick="selBatch=${b};renderBatchPage()">第${b}页 ${br.length}/${ps} · ${fmtA(bTotal)}</span>`;
      }).join(''):'<span style="color:#64748b">暂无记录</span>';
    }
  }catch(e){}
}

async function savePage(silent=false){
  if(silent && !_pageDirty){return;} // 无变更则跳过
  const inputs=$('pageForm').querySelectorAll('input');
  const rows=[];
  for(let i=0;i<inputs.length;i+=3){
    const nameInp=inputs[i],amtInp=inputs[i+1],noteInp=inputs[i+2];
    const name=nameInp.value.trim();
    const amt=parseFloat(amtInp.value);
    if(!name||!amt||amt<=0)continue;
    rows.push({id:parseInt(nameInp.dataset.rid)||0,name,amount:amt,note:noteInp.value.trim()});
  }
  if(rows.length===0){if(!silent)toast('请至少填写一条完整记录',1);return;}

  const evt=(isUnarchivedMode?unarchivedEvts:events).find(e=>e.id===selEvtId);
  const defaultDate=evt&&evt.event_date?evt.event_date:'';
  // 非阻塞保存：不遮罩UI，只更新本地数据
  const res=await fetch(API+'/records/batch',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({event_id:selEvtId,batch:selBatch,date:defaultDate,records:rows})
  });
  const data=await res.json();
  if(!silent)toast(data.success?`保存完成: ${rows.length}条`:`保存失败: ${data.error}`,data.success?0:1);

  // 本地更新 evtRecords
  for(const r of rows){
    if(r.id){
      const idx=evtRecords.findIndex(x=>x.id===r.id);
      if(idx>=0){evtRecords[idx].name=r.name;evtRecords[idx].amount=r.amount;evtRecords[idx].note=r.note;}
    }else{
      evtRecords.push({id:Date.now(),event_id:selEvtId,name:r.name,amount:r.amount,note:r.note,batch:selBatch,direction:'收',date:defaultDate});
    }
  }
  _pageDirty=false;
  _refreshLocalNav();    // 仅刷新统计数字和分页导航，不重建表单
}

function _refreshLocalNav(){
  const evt=(isUnarchivedMode?unarchivedEvts:events).find(e=>e.id===selEvtId);
  if(!evt)return;
  const total=evtRecords.reduce((s,r)=>s+(r.amount||0),0);
  const isDaily=evt.event_type==='日常'||evt.name==='流水';
  $('evtStats').innerHTML=`
    <div class="stat-card"><div class="slabel">${isDaily?'送出总额':'收到总额'}</div><div class="svalue">${fmtA(total)} 元</div></div>
    <div class="stat-card sub"><div class="slabel">记录数</div><div class="svalue">${evtRecords.length} 条</div></div>
    <div class="stat-card sub"><div class="slabel">涉及人数</div><div class="svalue">${new Set(evtRecords.map(r=>r.name)).size} 人</div></div>
    <div class="stat-card sub"><div class="slabel">页数</div><div class="svalue">${new Set(evtRecords.map(r=>r.batch)).size}</div></div>`;
  const batches=[...new Set(evtRecords.map(r=>r.batch))].sort((a,b)=>a-b);
  const ps=evt.page_size||12;
  $('batchNav').innerHTML=batches.length?batches.map(b=>{
    const br=evtRecords.filter(r=>r.batch===b);
    const bTotal=br.reduce((s,r)=>s+(r.amount||0),0);
    return `<span class="${b===selBatch?'on':''}" onclick="selBatch=${b};renderBatchPage()">第${b}页 ${br.length}/${ps} · ${fmtA(bTotal)}</span>`;
  }).join(''):'<span style="color:#64748b">暂无记录</span>';
}

async function toggleLock(){
  const res=await fetch(API+'/events/'+selEvtId+'/lock',{method:'POST'});
  if(res.ok){
    toast('已切换锁定状态');
    // 只刷新事件列表+轻量更新当前详情，避免全量 reload
    const allEvts=await apiGet('/events');
    const nonDaily=allEvts.filter(e=>e.event_type!=='日常');
    events=nonDaily.filter(e=>e.archived);
    unarchivedEvts=nonDaily.filter(e=>!e.archived);
    renderEvtGrid();
    renderUnarchivedGrid();
    const evt=(isUnarchivedMode?unarchivedEvts:events).find(e=>e.id===selEvtId);
    if(evt){
      $('evtLockBtn').textContent=evt.locked?'解锁':'锁定';
      evtRecords=await apiGet('/records?event_id='+selEvtId);
      $('evtTitle').innerHTML=`${escH(evt.name)} <span style="font-size:12px;color:#64748b">(${escH(evtTypeLabel(evt.event_type))}${evt.event_date?' | '+evt.event_date:''})</span>`;
      renderBatchPage();
    }
  }else{const e=await res.json();toast(e.error||'操作失败',1);}
}

async function toggleArchive(){
  const res=await fetch(API+'/events/'+selEvtId+'/archive',{method:'POST'});
  if(res.ok){
    const data=await res.json();
    toast(data.archived?'已归档':'已取消归档');
    isUnarchivedMode=!data.archived;
    $('evtArchiveBtn').textContent=data.archived?'取消归档':'归档';
    await loadEvents();
  }else{const e=await res.json();toast(e.error||'操作失败',1);}
}

async function toggleDailyLock(){
  if(!dailyEventId){toast('日常事件不存在',1);return;}
  const res=await fetch(API+'/events/'+dailyEventId+'/lock',{method:'POST'});
  if(res.ok){toast('已切换锁定状态');loadDaily();}
  else{const e=await res.json();toast(e.error||'操作失败',1);}
}

function showEvtModal(evt){
  let title='新增事件';
  if(evt)title='编辑事件';
  const selType=evt?evt.event_type:'事件';
  const saveFn=evt?`saveEvt(${evt.id})`:'saveEvt()';
  showModal(`<h3>${title}</h3>
    <div class="fgroup"><label>事件名称</label><input type="text" id="mEName" value="${evt?escH(evt.name):''}"></div>
    <div class="fgroup"><label>类型</label><select id="mEType">
      <option value="事件" ${selType==='事件'?'selected':''}>事件</option>
      <option value="喜事" ${selType==='喜事'?'selected':''}>喜事</option>
      <option value="丧事" ${selType==='丧事'?'selected':''}>白事</option>
    </select></div>
    <div class="fgroup"><label>日期</label><input type="date" id="mEDate" value="${evt?evt.event_date||'':''}"></div>
    <div class="fgroup"><label>每页条数</label><input type="number" id="mEPageSize" value="${evt?evt.page_size||12:12}" min="4" max="50" step="1"></div>
    <div class="btn-row">
      <button class="btn" onclick="hideModal()">取消</button>
      <button class="btn primary" onclick="${saveFn}">保存</button>
    </div>`);
}

async function saveEvt(eid){
  const name=$('mEName').value.trim(),type=$('mEType').value,date=$('mEDate').value,ps=parseInt($('mEPageSize').value)||12;
  if(!name){toast('事件名称不能为空',1);return;}
  const body={name,event_type:type,event_date:date,page_size:ps};
  const isNew = eid===undefined || eid===null;
  const url = isNew ? API+'/events' : API+'/events/'+eid;
  const method = isNew ? 'POST' : 'PUT';
  let res;
  try{
    res=await fetch(url,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  }catch(netErr){
    toast('网络请求失败，请检查网络连接',1);return;
  }
  if(res.ok){toast(isNew?'已创建':'已更新');hideModal();loadEvents();if(curPg==='daily')loadDaily();}
  else{
    let errMsg='保存失败';
    try{
      const ct=res.headers.get('content-type')||'';
      if(ct.includes('json')){
        const e=await res.json();
        errMsg=e.error||e.msg||errMsg;
      }else{
        const txt=await res.text();
        errMsg=`服务器错误(${res.status})`;
        if(txt&&txt.length<200)errMsg+=': '+txt.substring(0,100);
      }
    }catch(x){errMsg=`请求失败(状态码 ${res.status})`;}
    toast(errMsg,1);
  }
}

function editEvt(){
  const evt=(isUnarchivedMode?unarchivedEvts:events).find(e=>e.id===selEvtId);
  if(evt)showEvtModal(evt);
}

async function deleteEvt(){
  showConfirm('确定删除此事件及其所有记录？此操作不可恢复。',async()=>{
    const res=await fetch(API+'/events/'+selEvtId,{method:'DELETE'});
    if(res.ok){toast('已删除');selEvtId=null;$('evtDetail').style.display='none';loadEvents();}
    else{const e=await res.json();toast(e.error||'删除失败',1);}
  });
}

// ==================== 数据总览 ====================
async function loadStats(){
  try{
    const dash=await apiGet('/dashboard');
    const ov=dash.overview;
    $('sSummary').innerHTML=`
      <div class="stat-card"><div class="slabel">总收到</div><div class="svalue">${fmtA(ov.total_rec)} 元</div></div>
      <div class="stat-card"><div class="slabel">总送出</div><div class="svalue">${fmtA(ov.total_send)} 元</div></div>
      <div class="stat-card sub"><div class="slabel">涉及人数</div><div class="svalue">${ov.person_cnt} 人</div></div>
      <div class="stat-card sub"><div class="slabel">总记录</div><div class="svalue">${ov.total_records} 条</div></div>`;

    $('sEvtTable').innerHTML=dash.events.map(e=>`<tr>
      <td>${escH(e.name)}${e.locked?' <span style="font-size:11px;color:#f87171">[锁定]</span>':''}</td>
      <td>${escH(evtTypeLabel(e.event_type))}</td><td>${e.record_count}</td><td class="amt">${fmtA(e.total_amount)}</td>
    </tr>`).join('');

    const bal=await apiGet('/balance');
    const oweThem=bal.owe_them||[],oweMe=bal.owe_me||[],even=bal.even||[];
    const all=[...oweThem.map(x=>({...x,label:'我欠对方'})),...oweMe.map(x=>({...x,label:'对方欠我'})),...even.map(x=>({...x,label:'持平'}))];
    $('sBalTable').innerHTML=all.length?all.map(x=>`<tr>
      <td style="text-align:center">${escH(x.name)}</td><td class="amt num" style="text-align:center">${fmtA(x.rec)}</td><td class="amt num" style="text-align:center">${fmtA(x.send)}</td>
      <td class="amt num" style="text-align:center;color:${x.net>0?'#27ae60':x.net<0?'#c0392b':''}">${x.net>0?'+'+fmtA(x.net):x.net<0?fmtA(x.net):'0'}</td>
      <td style="text-align:center;color:#64748b;font-size:12px">${x.label}</td>
    </tr>`).join(''):'<tr><td colspan="5" style="text-align:center;padding:20px;color:#64748b">暂无数据</td></tr>';
  }catch(e){$('sSummary').innerHTML='<div style="text-align:center;color:#64748b;padding:20px">加载失败，请刷新重试</div>';}

  // 人员查找：附加模糊搜索并监听输入
  setTimeout(()=>{
    const sInp=$('sSearchName');
    acAttach(sInp);
    sInp.addEventListener('keydown',e=>{
      if(e.key==='Enter'&&!document.querySelector('.ac-dd.show')){e.preventDefault();loadPersonDetail();}
    });
    let pt;
    sInp.addEventListener('input',()=>{clearTimeout(pt);pt=setTimeout(loadPersonDetail,400);});
  },10);
}

async function loadPersonDetail(){
  const name=$('sSearchName').value.trim();
  const box=$('sPersonDetail');
  if(!name){box.innerHTML='';return;}
  try{
    const d=await apiGet('/person?name='+encodeURIComponent(name));
    if(!d||!d.name){box.innerHTML='<div style="color:#64748b;padding:8px">未找到该人员记录</div>';return;}
    const net=d.total_rec-d.total_send;
    const tag=net>0?'我欠对方':net<0?'对方欠我':'持平';
    const cls=net>0?'color:#059669':net<0?'color:#dc2626':'';
    box.innerHTML=`
      <div style="background:#f1f5f9;border-radius:6px;padding:12px 16px;margin-bottom:12px">
        <span style="font-weight:600;font-size:14px">${escH(d.name)}</span>
        <span style="margin-left:12px;color:#64748b;font-size:12px">${tag}</span>
        <div style="display:flex;gap:20px;margin-top:8px;font-size:13px">
          <span>收到 <b style="color:#4ade80">${fmtA(d.total_rec)}</b></span>
          <span>送出 <b style="color:#f87171">${fmtA(d.total_send)}</b></span>
          <span>净额 <b style="${cls}">${net>0?'+'+fmtA(net):fmtA(net)}</b></span>
          <span style="color:#64748b">共 ${d.total_count} 条记录</span>
        </div>
      </div>
      <div class="t-wrap"><table><thead><tr><th>事件</th><th>日期</th><th>方向</th><th>金额</th><th>备注</th></tr></thead><tbody>
      ${d.events.map(ev=>{
        const eType=evtTypeLabel(ev.event_type||'');
        return ev.records.map(r=>`<tr>
          <td>${escH(ev.name)}<span style="color:#64748b;font-size:11px;margin-left:4px">${escH(eType)}</span></td>
          <td>${fmtD(r.date)}</td>
          <td>${r.direction==='收'?'收到':'送出'}</td>
          <td class="amt${r.direction==='收'?' num':''}" style="color:${r.direction==='收'?'#27ae60':'#c0392b'}">${fmtA(r.amount)}</td>
          <td style="color:#64748b;font-size:12px">${escH(r.note||'')}</td>
        </tr>`).join('');
      }).join('')}
      ${d.events.length===0?`<tr><td colspan="5" style="text-align:center;color:#64748b;padding:12px">暂无记录</td></tr>`:''}
      </tbody></table></div>`;
  }catch(e){box.innerHTML='';}
}

// ==================== 键盘快捷键 ====================
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')hideModal();
  if(e.ctrlKey&&e.key==='Enter'){
    if(curPg==='daily')saveDaily();
    else if(curPg==='event')savePage(true);
  }
});

initDateSelects();
loadDaily();
