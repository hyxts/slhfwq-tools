<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="采购台账">
<meta name="theme-color" content="#f8fafc">
<link rel="apple-touch-icon" href="/purchase/icon-192.svg">
<link rel="icon" type="image/svg+xml" href="/purchase/icon-512.svg">
<link rel="manifest" href="/purchase/manifest.json">
<title>采购台账</title>
<style>
:root {
    --primary:#0e7490; --primary-weak:#e0f2f7; --bg:#f0f2f5; --card-bg:#ffffff;
    --text:#1e293b; --text-secondary:#64748b; --border:#e2e8f0;
    --success:#10b981; --danger:#dc2626; --warn:#d97706;
    --shadow:0 2px 8px rgba(0,0,0,.06);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased; padding-top:env(safe-area-inset-top); padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); padding-bottom:calc(16px + env(safe-area-inset-bottom)); }
body::before { content:''; position:fixed; top:0; left:0; right:0; height:env(safe-area-inset-top); background:var(--card-bg); z-index:101; pointer-events:none; }
@media (hover:hover){ .btn-primary:hover { opacity:.9; } .row:hover { background:#f8fafc; } }
header { background:var(--card-bg); border-bottom:1px solid #e2e8f0; padding:12px 16px; position:sticky; top:0; z-index:100; display:flex; align-items:center; justify-content:space-between; }
.header-left { display:flex; align-items:center; gap:8px; }
.back { display:flex; align-items:center; justify-content:center; color:#64748b; font-size:20px; min-width:44px; min-height:44px; text-decoration:none; }
header h1 { font-size:17px; font-weight:700; }
.container { max-width:1400px; margin:0 auto; padding:12px 16px; }
.card { background:var(--card-bg); border-radius:12px; box-shadow:var(--shadow); padding:16px; margin-bottom:12px; }
button { padding:10px 20px; border:none; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; min-height:44px; }
.btn-primary { background:var(--primary); color:#fff; }
.btn-outline { background:transparent; border:1px solid var(--border); color:var(--text); }
.btn-sm { padding:4px 10px; font-size:12px; min-height:auto; border-radius:8px; }
.btn-danger-sm { background:#fee2e2; color:var(--danger); }
/* 统计 */
.stat-overview { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; margin-bottom:12px; }
.stat-card { background:var(--card-bg); border-radius:10px; padding:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.s-label { font-size:11px; color:var(--text-secondary); margin-bottom:4px; }
.s-value { font-size:18px; font-weight:700; }
.s-value.warn { color:var(--warn); }
.s-value.primary { color:var(--primary); }
/* 筛选栏 */
.filter-bar { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
.filter-bar input, .filter-bar select { padding:8px 10px; border:1px solid var(--border); border-radius:10px; font-size:13px; background:var(--card-bg); min-height:44px; }
.filter-bar input[type=date], .filter-bar input[type=search] { min-height:44px; }
/* 表格 */
.table-wrap { overflow-x:auto; border:1px solid #c8cdd3; border-radius:10px; background:#fff; }
table { border-collapse:collapse; width:100%; font-size:12.5px; min-width:1080px; }
thead th { position:sticky; top:0; background:#0e7490; color:#fff; padding:8px 8px; text-align:left; white-space:nowrap; font-weight:600; }
tbody td { padding:7px 8px; border-bottom:1px solid #f1f5f9; white-space:nowrap; }
td.num { text-align:right; font-variant-numeric:tabular-nums; }
td.wrap { white-space:normal; word-break:break-all; min-width:110px; }
.badge { font-size:10.5px; padding:2px 8px; border-radius:10px; font-weight:600; white-space:nowrap; }
.badge.none { background:#f1f5f9; color:#64748b; }
.badge.part { background:#fef3c7; color:#b45309; }
.badge.done { background:#dcfce7; color:#16a34a; }
.badge.inv { background:#e0f2f7; color:#0e7490; }
.row-actions { display:flex; gap:4px; }
.empty { text-align:center; color:var(--text-secondary); padding:28px 0; font-size:13px; }
/* 汇总 */
.sum-sec { margin-top:12px; display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:12px; }
.sum-sec h4 { font-size:13px; font-weight:600; margin-bottom:8px; }
.sum-row { display:flex; align-items:center; gap:8px; padding:6px 10px; background:var(--card-bg); border-radius:8px; margin-bottom:5px; box-shadow:0 1px 3px rgba(0,0,0,.04); font-size:12.5px; cursor:pointer; }
.sum-row .name { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; word-break:break-all; }
.sum-row .val { font-weight:600; white-space:nowrap; }
/* 统计表 */
.stat-wrap { overflow-x:auto; }
.stat-tbl { width:100%; border-collapse:collapse; font-size:12.5px; min-width:640px; }
.stat-tbl th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--border); color:var(--text-secondary); font-weight:600; white-space:nowrap; }
.stat-tbl td { padding:6px 8px; border-bottom:1px solid #f1f5f9; white-space:nowrap; }
.stat-tbl td.num, .stat-tbl th.num { text-align:right; font-variant-numeric:tabular-nums; }
.stat-tbl tfoot td { font-weight:700; border-top:1px solid var(--border); border-bottom:none; }
.bar-mini { display:inline-block; height:6px; background:var(--primary); border-radius:3px; vertical-align:middle; min-width:2px; }
/* 对账单 */
.recon-head { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:baseline; margin-bottom:10px; font-size:13px; }
.recon-head .t { font-size:16px; font-weight:700; }
.recon-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:8px; margin-bottom:10px; }
.recon-tbl { width:100%; border-collapse:collapse; font-size:12.5px; }
.recon-tbl th { text-align:left; padding:6px 8px; background:#f1f5f9; white-space:nowrap; }
.recon-tbl td { padding:6px 8px; border-bottom:1px solid #f1f5f9; white-space:nowrap; }
.recon-tbl td.num { text-align:right; font-variant-numeric:tabular-nums; }
.recon-tbl tfoot td { font-weight:700; border-top:2px solid var(--border); }
.tag-recon { font-size:10.5px; background:#dcfce7; color:#16a34a; border-radius:8px; padding:1px 6px; }
.tag-unrecon { font-size:10.5px; background:#fef3c7; color:#b45309; border-radius:8px; padding:1px 6px; }
@media print {
    body > header, .container, #cfgModal, #toast, .filter-bar, .modal-actions { display:none !important; }
    .modal-overlay { position:static !important; display:block !important; background:#fff !important; padding:0 !important; }
    .modal { max-width:none !important; box-shadow:none !important; padding:0 !important; max-height:none !important; overflow:visible !important; }
    #reconArea { max-height:none !important; overflow:visible !important; }
    .recon-tbl th { background:#e2e8f0 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
}

/* 配置面板 */
.cfg-tabs { display:flex; gap:6px; margin-bottom:12px; }
.cfg-tab { padding:8px 14px; border-radius:9px; font-size:13px; font-weight:600; border:1px solid var(--border); background:#fff; color:var(--text-secondary); cursor:pointer; min-height:44px; }
.cfg-tab.on { background:var(--primary); border-color:var(--primary); color:#fff; }
.cfg-form { background:#f8fafc; border-radius:10px; padding:10px; margin-bottom:10px; }
.cfg-list { max-height:46vh; overflow-y:auto; }
.cfg-item { display:flex; align-items:center; gap:8px; padding:8px 10px; background:#fff; border-radius:8px; margin-bottom:6px; box-shadow:0 1px 3px rgba(0,0,0,.04); font-size:12.5px; }
.cfg-item.off { opacity:.5; }
.cfg-item .nm { font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; word-break:break-all; }
.cfg-item .meta { color:var(--text-secondary); font-size:11.5px; }
.cfg-item .grow { flex:1; min-width:0; }
.cfg-item .acts { display:flex; gap:4px; flex-shrink:0; }
.tag-off { font-size:10.5px; background:#f1f5f9; color:#64748b; border-radius:8px; padding:1px 6px; }
.sync-line { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-secondary); margin-top:6px; }
.sync-line input { width:16px; height:16px; }

/* 弹窗 */
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:200; display:none; align-items:center; justify-content:center; padding:20px; }
.modal-overlay.show { display:flex; }
.modal { background:var(--card-bg); border-radius:14px; padding:20px; width:100%; max-width:440px; max-height:85vh; overflow-y:auto; }
.modal h4 { font-size:16px; font-weight:600; margin-bottom:14px; }
.form-row { display:flex; gap:8px; margin-bottom:8px; }
.field { flex:1; }
.field label { display:block; font-size:11px; color:var(--text-secondary); margin-bottom:2px; }
.field input, .field select { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:10px; font-size:16px; background:var(--card-bg); -webkit-appearance:none; min-height:44px; }
.field input:focus, .field select:focus { outline:none; border-color:var(--primary); }
.derived { display:flex; gap:12px; font-size:12px; color:var(--text-secondary); background:var(--primary-weak); border-radius:8px; padding:8px 12px; margin-bottom:8px; }
.derived b { color:var(--primary); }
.modal-actions { display:flex; gap:8px; margin-top:10px; }
#toast { position:fixed; left:50%; transform:translateX(-50%); bottom:80px; background:#1e293b; color:#fff; padding:10px 20px; border-radius:10px; font-size:13px; z-index:300; display:none; max-width:80vw; word-break:break-all; }
@media (max-width:768px){
    .container { max-width:100vw; padding:10px 12px; }
    .table-head { display:none; }
    .table-wrap { border:none; background:transparent; overflow:visible; }
    table { min-width:0; display:block; }
    thead { display:none; }
    tbody { display:block; }
    .row { display:block; background:var(--card-bg); border-radius:10px; box-shadow:0 1px 4px rgba(0,0,0,.05); padding:10px 12px; margin-bottom:8px; }
    tbody td { display:flex; justify-content:space-between; gap:10px; border-bottom:1px dashed #f1f5f9; padding:5px 0; white-space:normal; }
    tbody td::before { content:attr(data-l); color:var(--text-secondary); font-size:11.5px; flex-shrink:0; }
    tbody td:last-child { border-bottom:none; justify-content:flex-end; }
    td.num { text-align:right; }
    td.wrap { min-width:0; }
}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <a class="back" href="/nav" title="返回导航" onclick="if(document.referrer.includes('/nav')){history.back();return false}">&larr;</a>
    <h1>采购台账</h1>
  </div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn-outline btn-sm" style="min-height:36px" onclick="openRecon()">对账报表</button>
    <button class="btn-outline btn-sm" style="min-height:36px" onclick="openConfig()">⚙ 配置</button>
    <button class="btn-outline btn-sm" style="min-height:36px" onclick="doImport()">导入Excel</button>
    <button class="btn-outline btn-sm" style="min-height:36px" onclick="doExport()">导出Excel</button>
    <button class="btn-primary btn-sm" style="min-height:36px" onclick="openModal()">+ 新增采购</button>
  </div>
</header>
<input type="file" id="importFile" accept=".xlsx" style="display:none" onchange="uploadImport(this)">
<div style="max-width:1400px;margin:6px auto 0;padding:0 12px;font-size:12px;color:var(--text-secondary)">
  导入按列名识别、列顺序随意：先 <a href="#" onclick="downloadTemplate();return false" style="color:var(--primary);font-weight:600">下载 Excel 导入模板</a>，填好后点「导入Excel」；重复单据号自动跳过。
</div>
<div class="container">
  <div class="stat-overview" id="statCards"></div>

  <div class="card">
    <div class="filter-bar">
      <input type="date" id="fStart" onchange="reload()">
      <span style="color:var(--text-secondary);font-size:12px">至</span>
      <input type="date" id="fEnd" onchange="reload()">
      <select id="fSupplier" onchange="reload()"><option value="">全部供应商</option></select>
      <select id="fCategory" onchange="reload()"><option value="">全部品类</option></select>
      <select id="fInvoice" onchange="reload()"></select>
      <select id="fStatus" onchange="reload()">
        <option value="">全部状态</option><option>未付款</option><option>部分付款</option><option>已付清</option>
      </select>
      <input type="search" id="fSearch" placeholder="搜索单号/摘要/账户…" style="flex:1;min-width:140px" onkeydown="if(event.key==='Enter')reload()">
      <button class="btn-outline btn-sm" style="min-height:44px" onclick="resetFilter()">重置</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>日期</th><th>单据号</th><th>供应商名称</th><th>品类</th><th>采购内容摘要</th>
          <th>发票类型</th><th style="text-align:right">采购总金额</th><th style="text-align:right">进项税额</th>
          <th style="text-align:right">不含税成本</th><th style="text-align:right">已开金额</th>
          <th style="text-align:right">已付金额</th><th style="text-align:right">未付余额</th>
          <th>付款账户</th><th>付款状态</th><th>操作</th>
        </tr></thead>
        <tbody id="tbody"><tr><td colspan="15" class="empty">加载中…</td></tr></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <div class="cfg-tabs" style="margin-bottom:10px;flex-wrap:wrap">
      <button class="cfg-tab on" id="dimMonth" onclick="setDim('month')">按月</button>
      <button class="cfg-tab" id="dimYear" onclick="setDim('year')">按年</button>
      <button class="cfg-tab" id="dimDay" onclick="setDim('day')">按日</button>
      <button class="cfg-tab" id="dimSupplier" onclick="setDim('supplier')">按供应商</button>
      <button class="cfg-tab" id="dimCategory" onclick="setDim('category')">按品类</button>
      <button class="cfg-tab" id="dimInvoice" onclick="setDim('invoice')">按发票类型</button>
    </div>
    <div id="statTable"></div>
  </div>
</div>

<div class="modal-overlay" id="reconModal">
  <div class="modal" style="max-width:900px">
    <h4>对账报表</h4>
    <div class="filter-bar" style="margin-bottom:10px">
      <select id="rSupplier" style="min-width:150px"><option value="">全部供应商</option></select>
      <input type="date" id="rStart">
      <span style="color:var(--text-secondary);font-size:12px">至</span>
      <input type="date" id="rEnd">
      <button class="btn-primary btn-sm" style="min-height:44px" onclick="runRecon()">生成对账单</button>
    </div>
    <div class="modal-actions" style="margin-bottom:10px">
      <button class="btn-outline" style="flex:1" onclick="printRecon()">打印 / 存为PDF</button>
      <button class="btn-outline" style="flex:1" onclick="exportRecon()">导出Excel</button>
      <button class="btn-outline" style="flex:1" onclick="closeRecon()">关闭</button>
    </div>
    <div id="reconArea" class="cfg-list" style="max-height:60vh"></div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h4 id="modalTitle">新增采购</h4>
    <div class="form-row">
      <div class="field"><label>日期 *</label><input type="date" id="mDate"></div>
      <div class="field"><label>单据号</label><input id="mBillNo" placeholder="如 20261008-01"></div>
    </div>
    <div class="form-row">
      <div class="field"><label>供应商名称 *</label><input id="mSupplier" list="dlSupplier" placeholder="如 旺绿商贸"><datalist id="dlSupplier"></datalist></div>
      <div class="field"><label>品类</label><input id="mCategory" list="dlCategory" placeholder="如 生鲜"><datalist id="dlCategory"></datalist></div>
    </div>
    <div class="form-row">
      <div class="field"><label>采购内容摘要</label><input id="mSummary" maxlength="200" placeholder="如 猪肉/蔬菜一批"></div>
    </div>
    <div class="form-row">
      <div class="field"><label>发票类型</label><select id="mInvoice"></select></div>
      <div class="field"><label>付款账户</label><input id="mPayAccount" list="dlAccount" placeholder="如 微信/银行卡"><datalist id="dlAccount"></datalist></div>
    </div>
    <div class="form-row">
      <div class="field"><label>采购总金额(含税/买价) *</label><input id="mTotal" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00"></div>
      <div class="field"><label>进项税额</label><input id="mTax" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00"></div>
    </div>
    <div class="form-row">
      <div class="field"><label>已开金额</label><input id="mInvoiced" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00"></div>
      <div class="field"><label>已付金额</label><input id="mPaid" type="number" step="0.01" min="0" inputmode="decimal" placeholder="0.00"></div>
    </div>
    <div class="derived">
      <span>不含税成本 <b id="dNet">0.00</b></span>
      <span>未付余额 <b id="dUnpaid">0.00</b></span>
    </div>
    <div class="modal-actions">
      <button class="btn-outline" style="flex:1" onclick="closeModal()">取消</button>
      <button class="btn-primary" style="flex:1" id="btnSave" onclick="save()">保存</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="cfgModal">
  <div class="modal" style="max-width:560px">
    <h4>基础配置</h4>
    <div class="cfg-tabs">
      <button class="cfg-tab on" id="tabSupplier" onclick="switchTab('supplier')">供应商</button>
      <button class="cfg-tab" id="tabCategory" onclick="switchTab('category')">品类</button>
      <button class="cfg-tab" id="tabAccount" onclick="switchTab('account')">付款账户</button>
    </div>

    <div id="cfgSupplier">
      <div style="display:flex;gap:10px;align-items:center;margin-bottom:10px;font-size:12px">
        <button class="btn-outline btn-sm" onclick="doImportSuppliers()">导入Excel</button>
        <a href="#" onclick="downloadSupplierTemplate();return false" style="color:var(--primary);font-weight:600">下载导入模板</a>
        <span style="color:var(--text-secondary)">重名默认跳过；要覆盖已有档案请先勾选「覆盖」</span>
        <label style="display:flex;align-items:center;gap:4px;color:var(--text-secondary);margin-left:auto"><input type="checkbox" id="sImportMode" style="width:16px;height:16px">覆盖</label>
      </div>
      <input type="file" id="importSupplierFile" accept=".xlsx" style="display:none" onchange="uploadSuppliers(this)">
      <div class="cfg-form">
        <div class="form-row">
          <div class="field"><label>供应商名称 *</label><input id="sName" placeholder="如 旺绿商贸"></div>
          <div class="field"><label>联系人</label><input id="sContact" placeholder="如 张老板"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>电话</label><input id="sPhone" placeholder="选填"></div>
          <div class="field"><label>主营品类</label><input id="sCategory" list="dlCategory" placeholder="如 生鲜"></div>
        </div>
        <div class="form-row">
          <div class="field"><label>默认发票类型</label><select id="sInvoice"></select></div>
          <div class="field"><label>备注</label><input id="sNote" placeholder="选填"></div>
        </div>
        <label class="sync-line" id="syncWrap" style="display:none"><input type="checkbox" id="sSync" checked>改名时同步更新历史采购记录</label>
        <div class="modal-actions" style="margin-top:8px">
          <button class="btn-outline" style="flex:0 0 90px" onclick="resetSupplierForm()">清空</button>
          <button class="btn-primary" style="flex:1" onclick="saveSupplier()">保存供应商</button>
        </div>
      </div>
      <div class="cfg-list" id="supplierList"></div>
    </div>

    <div id="cfgDict" style="display:none">
      <div class="cfg-form">
        <div class="form-row">
          <div class="field"><label id="dictLabel">名称 *</label><input id="dName" placeholder="新增后可在采购表单里下拉选择"></div>
        </div>
        <div class="modal-actions" style="margin-top:8px">
          <button class="btn-outline" style="flex:0 0 90px" onclick="resetDictForm()">清空</button>
          <button class="btn-primary" style="flex:1" onclick="saveDict()">保存</button>
        </div>
      </div>
      <div class="cfg-list" id="dictList"></div>
    </div>

    <div class="modal-actions">
      <button class="btn-outline" style="flex:1" onclick="closeConfig()">关闭</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
var $ = function(id){ return document.getElementById(id); };
var opts = { suppliers: [], categories: [], accounts: [], invoice_types: ['无票(不抵)','专票','普票'] };
var editId = null;

function toast(msg){
  var t = $('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._tm); t._tm = setTimeout(function(){ t.style.display = 'none'; }, 2200);
}
function fmt(v){ return (Number(v) || 0).toFixed(2); }
function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function fillSelect(sel, list, allLabel, cur){
  sel.innerHTML = '';
  if (allLabel !== undefined) {
    var o0 = document.createElement('option'); o0.value = ''; o0.textContent = allLabel; sel.appendChild(o0);
  }
  list.forEach(function(v){
    var o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o);
  });
  if (cur) sel.value = cur;
}

function loadOptions(){
  fetch('/api/purchase/options').then(function(r){ return r.json(); }).then(function(d){
    if (d.success) {
      opts = d.data;
      fillSelect($('fInvoice'), [''].concat(opts.invoice_types), '全部发票类型');
      fillSelect($('mInvoice'), opts.invoice_types);
      fillSelect($('sInvoice'), [''].concat(opts.invoice_types), '（不预设）');
      refreshDatalists();
    }
  });
  fetch('/api/purchase/suppliers').then(function(r){ return r.json(); }).then(function(d){
    if (!d.success) return;
    supplierMap = {};
    (d.data || []).forEach(function(s){ supplierMap[s.name] = s; });
    refreshDatalists();
    if ($('cfgModal').classList.contains('show')) renderSuppliers(d.data);
  });
}
// 选到已建档供应商时，自动带出主营品类与默认发票类型
function applySupplierPreset(){
  var s = supplierMap[($('mSupplier').value || '').trim()];
  if (!s) return;
  if (!$('mCategory').value && s.category) $('mCategory').value = s.category;
  if (s.default_invoice) $('mInvoice').value = s.default_invoice;
  toast('已带出「' + s.name + '」的默认设置');

function refreshDatalists(){
  fillSelect($('fSupplier'), opts.suppliers, '全部供应商', $('fSupplier').value);
  fillSelect($('fCategory'), opts.categories, '全部品类', $('fCategory').value);
  ['dlSupplier','dlCategory','dlAccount'].forEach(function(id){ $(id).innerHTML = ''; });
  opts.suppliers.forEach(function(v){ $('dlSupplier').insertAdjacentHTML('beforeend','<option value="'+esc(v)+'">'); });
  opts.categories.forEach(function(v){ $('dlCategory').insertAdjacentHTML('beforeend','<option value="'+esc(v)+'">'); });
  opts.accounts.forEach(function(v){ $('dlAccount').insertAdjacentHTML('beforeend','<option value="'+esc(v)+'">'); });
}

function queryParams(){
  var p = new URLSearchParams();
  if ($('fStart').value) p.set('start', $('fStart').value);
  if ($('fEnd').value) p.set('end', $('fEnd').value);
  if ($('fSupplier').value) p.set('supplier', $('fSupplier').value);
  if ($('fCategory').value) p.set('category', $('fCategory').value);
  if ($('fInvoice').value) p.set('invoice', $('fInvoice').value);
  if ($('fStatus').value) p.set('status', $('fStatus').value);
  if ($('fSearch').value.trim()) p.set('search', $('fSearch').value.trim());
  return p.toString();
}
function reload(){
  var qs = queryParams();
  fetch('/api/purchase/records?' + qs).then(function(r){ return r.json(); }).then(function(d){
    if (!d.success) { toast(d.error || '加载失败'); return; }
    renderRows(d.data);
  });
  fetch('/api/purchase/stats?' + qs).then(function(r){ return r.json(); }).then(function(d){
    if (!d.success) return;
    lastStats = d.data;

    renderStatView();

/* ==================== 统计：按年/月/日/供应商/品类/发票类型 ==================== */
var statDim = 'month';
var lastStats = null;
var DIM_LABEL = { year: '年份', month: '月份', day: '日期',
                  supplier: '供应商', category: '品类', invoice: '发票类型' };

function isTimeDim(d){ return d === 'year' || d === 'month' || d === 'day'; }
function setDim(dim){
  statDim = dim;
  ['month','year','day','supplier','category','invoice'].forEach(function(d){
    $('dim' + d.charAt(0).toUpperCase() + d.slice(1)).classList.toggle('on', d === dim);
  });
  renderStatView();
}
function renderStatView(){
  if (isTimeDim(statDim)) { fetchTrends(); return; }
  if (!lastStats) return;
  var map = { supplier: ['by_supplier', 'supplier'],
              category: ['by_category', 'category'],
              invoice: ['by_invoice', 'invoice_type'] }[statDim];
  var rows = (lastStats[map[0]] || []).map(function(r){
    return { name: r[map[1]] || '（未填）', cnt: r.cnt, total: r.total,
             tax: r.tax || 0, net: r.net_cost || ((r.total || 0) - (r.tax || 0)),
             paid: r.paid || 0, unpaid: r.unpaid || 0 };
  });
  renderStatTable(rows, DIM_LABEL[statDim], lastStats.total || 0);
}
function fetchTrends(){
  var qs = queryParams();
  fetch('/api/purchase/trends?group=' + statDim + '&' + qs).then(function(r){ return r.json(); }).then(function(d){
    if (!d.success) return;
    var rows = (d.data.rows || []).map(function(r){
      return { name: r.period, cnt: r.cnt, total: r.total, tax: r.tax || 0,
               net: r.net_cost || 0, paid: r.paid || 0, unpaid: r.unpaid || 0 };
    });
    renderStatTable(rows, DIM_LABEL[statDim], d.data.total || 0);
  });
}
function renderStatTable(rows, nameLabel, grandTotal){
  if (!rows.length) { $('statTable').innerHTML = '<div class="empty">当前筛选下没有数据</div>'; return; }
  var clickable = statDim === 'supplier';
  var body = rows.map(function(r){
    var pct = grandTotal > 0 ? (r.total / grandTotal * 100) : 0;
    var nm = clickable
      ? '<span style="color:var(--primary);cursor:pointer" onclick="pickSupplier(\'' + esc(String(r.name)).replace(/'/g, "\\'") + '\')">' + esc(r.name) + '</span>'
      : esc(r.name);
    return '<tr><td>' + nm + '</td><td class="num">' + r.cnt + '</td><td class="num">' + fmt(r.total)
      + '</td><td class="num">' + fmt(r.tax) + '</td><td class="num">' + fmt(r.net)
      + '</td><td class="num">' + fmt(r.paid) + '</td><td class="num">' + fmt(r.unpaid)
      + '</td><td><span class="bar-mini" style="width:' + Math.max(2, pct * 0.9).toFixed(1) + 'px"></span> '
      + pct.toFixed(1) + '%</td></tr>';
  }).join('');
  var sum = rows.reduce(function(a, r){ return {
    cnt: a.cnt + r.cnt, total: a.total + r.total, tax: a.tax + r.tax,
    net: a.net + r.net, paid: a.paid + r.paid, unpaid: a.unpaid + r.unpaid }; },
    { cnt: 0, total: 0, tax: 0, net: 0, paid: 0, unpaid: 0 });
  $('statTable').innerHTML = '<div class="stat-wrap"><table class="stat-tbl"><thead><tr>'
    + '<th>' + nameLabel + '</th><th class="num">笔数</th><th class="num">采购额</th>'
    + '<th class="num">进项税</th><th class="num">不含税</th><th class="num">已付</th>'
    + '<th class="num">未付</th><th>占比</th></tr></thead><tbody>' + body + '</tbody><tfoot><tr>'
    + '<td>合计</td><td class="num">' + sum.cnt + '</td><td class="num">' + fmt(sum.total)
    + '</td><td class="num">' + fmt(sum.tax) + '</td><td class="num">' + fmt(sum.net)
    + '</td><td class="num">' + fmt(sum.paid) + '</td><td class="num">' + fmt(sum.unpaid)
    + '</td><td></td></tr></tfoot></table></div>';
}
function renderStats(s){
  var cards = [
    ['笔数', s.count, ''],
    ['采购总金额', fmt(s.total), 'primary'],
    ['进项税额', fmt(s.tax), ''],
    ['不含税成本', fmt(s.net_cost), ''],
    ['已开金额', fmt(s.invoiced), ''],
    ['未付余额', fmt(s.unpaid), s.unpaid > 0 ? 'warn' : '']
  ];
  $('statCards').innerHTML = cards.map(function(c){
    return '<div class="stat-card"><div class="s-label">'+c[0]+'</div><div class="s-value '+c[2]+'">'+c[1]+'</div></div>';
  }).join('');
}
function pickSupplier(name){ $('fSupplier').value = name; reload(); }

function statusBadge(s){
  var cls = s === '已付清' ? 'done' : (s === '部分付款' ? 'part' : 'none');
  return '<span class="badge '+cls+'">'+s+'</span>';
}
function invBadge(v){ return '<span class="badge inv">'+esc(v)+'</span>'; }

function renderRows(rows){
  var tb = $('tbody');
  if (!rows.length) { tb.innerHTML = '<tr><td colspan="15" class="empty">暂无记录，点右上角「新增采购」开始记账</td></tr>'; return; }
  tb.innerHTML = rows.map(function(r){
    var cells = [
      ['日期', esc(r.date), ''],
      ['单据号', esc(r.bill_no), ''],
      ['供应商', esc(r.supplier), 'wrap'],
      ['品类', esc(r.category), ''],
      ['摘要', esc(r.summary), 'wrap'],
      ['发票', invBadge(r.invoice_type), ''],
      ['总金额', fmt(r.total_amount), 'num'],
      ['进项税', fmt(r.input_tax), 'num'],
      ['不含税', fmt(r.net_cost), 'num'],
      ['已开', fmt(r.invoiced_amount), 'num'],
      ['已付', fmt(r.paid_amount), 'num'],
      ['未付', fmt(r.unpaid_balance), 'num'],
      ['账户', esc(r.pay_account), ''],
      ['状态', statusBadge(r.pay_status), '']
    ];
    var acts = '<div class="row-actions"><button class="btn-outline btn-sm" onclick="openModal('+r.id+')">编辑</button>'
             + '<button class="btn-sm btn-danger-sm" onclick="del('+r.id+')">删除</button></div>';
    return '<tr class="row">' + cells.map(function(c){
      return '<td class="'+c[2]+'" data-l="'+c[0]+'">'+c[1]+'</td>';
    }).join('') + '<td data-l="操作">'+acts+'</td></tr>';
  }).join('');
}

function openModal(id){
  editId = id || null;
  $('modalTitle').textContent = id ? '编辑采购' : '新增采购';
  $('mDate').value = new Date().toISOString().slice(0, 10);
  ['mBillNo','mSupplier','mCategory','mSummary','mPayAccount'].forEach(function(id){ $(id).value=''; });
  ['mTotal','mTax','mInvoiced','mPaid'].forEach(function(id){ $(id).value=''; });
  $('mInvoice').value = opts.invoice_types[0];
  updateDerived();
  if (id) {
    fetch('/api/purchase/records?search=&limit=5000').then(function(r){ return r.json(); }).then(function(d){
      var rec = (d.data || []).find(function(x){ return x.id === id; });
      if (!rec) { toast('记录不存在'); return; }
      $('mDate').value = rec.date; $('mBillNo').value = rec.bill_no;
      $('mSupplier').value = rec.supplier; $('mCategory').value = rec.category;
      $('mSummary').value = rec.summary; $('mInvoice').value = rec.invoice_type;
      $('mPayAccount').value = rec.pay_account;
      $('mTotal').value = rec.total_amount; $('mTax').value = rec.input_tax;
      $('mInvoiced').value = rec.invoiced_amount; $('mPaid').value = rec.paid_amount;
      updateDerived();
    });
  }
  $('modal').classList.add('show');
}
function closeModal(){ $('modal').classList.remove('show'); }
function updateDerived(){
  var total = parseFloat($('mTotal').value) || 0;
  var tax = parseFloat($('mTax').value) || 0;
  var paid = parseFloat($('mPaid').value) || 0;
  $('dNet').textContent = (total - tax).toFixed(2);
  $('dUnpaid').textContent = (total - paid).toFixed(2);
}
['mTotal','mTax','mPaid'].forEach(function(id){ document.addEventListener('input', function(e){ if (e.target.id === id) updateDerived(); }); });

function save(){
  var payload = {
    date: $('mDate').value, bill_no: $('mBillNo').value,
    supplier: $('mSupplier').value, category: $('mCategory').value,
    summary: $('mSummary').value, invoice_type: $('mInvoice').value,
    total_amount: $('mTotal').value, input_tax: $('mTax').value,
    invoiced_amount: $('mInvoiced').value, paid_amount: $('mPaid').value,
    pay_account: $('mPayAccount').value
  };
  $('btnSave').disabled = true;
  var url = editId ? '/api/purchase/records/' + editId : '/api/purchase/records';
  fetch(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) })
    .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
    .then(function(res){
      $('btnSave').disabled = false;
      if (!res.d.success) { toast(res.d.error || '保存失败'); return; }
      closeModal(); toast('已保存');
      loadOptions(); reload();
    })
    .catch(function(){ $('btnSave').disabled = false; toast('网络错误'); });
}
function del(id){
  if (!confirm('确定删除这条采购记录？不可恢复。')) return;
  fetch('/api/purchase/records/' + id, { method: 'DELETE' }).then(function(r){ return r.json(); }).then(function(d){
    if (d.success) { toast('已删除'); loadOptions(); reload(); }
    else toast(d.error || '删除失败');
  });
}
function resetFilter(){
  ['fStart','fEnd','fSearch'].forEach(function(id){ $(id).value=''; });
  $('fSupplier').value = ''; $('fCategory').value = '';
  $('fInvoice').value = ''; $('fStatus').value = '';
  reload();
}
function doExport(){ window.open('/api/purchase/export?' + queryParams(), '_blank'); }
function doImport(){ $('importFile').click(); }
function downloadTemplate(){ window.open('/api/purchase/template', '_blank'); }
function uploadImport(input){
  var f = input.files && input.files[0];
  if (!f) return;
  if (!/\\.xlsx$/i.test(f.name)) { alert('只支持 .xlsx（Excel 2007 及以后）；老版 .xls 请另存为 .xlsx'); input.value=''; return; }
  if (!confirm('导入「' + f.name + '」？\n\n重复的单据号会自动跳过，不会覆盖已有记录。')) { input.value=''; return; }
  var fd = new FormData();
  fd.append('file', f);
  fd.append('auto_supplier', '1');
  toast('正在导入…');
  fetch('/api/purchase/import', { method: 'POST', body: fd })
    .then(function(r){ return r.json(); }).then(function(d){
      input.value = '';
      if (!d.success) { alert(d.error || '导入失败'); return; }
      var r = d.data;
      var msg = '导入完成：成功 ' + r.imported + ' 条';
      if (r.skipped) msg += '\n跳过重复 ' + r.skipped + ' 条';
      if (r.errors && r.errors.length) {
        msg += '\n' + r.errors.length + ' 行未导入，例如第 ' + r.errors[0].row
             + ' 行（' + r.errors[0].supplier + '）：' + r.errors[0].reason;
      }
      alert(msg);
      loadOptions(); reload();
    })
    .catch(function(){ input.value=''; alert('导入失败：网络或文件异常'); });
}

/* ---- 供应商 ---- */
function loadSuppliers(){
  fetch('/api/purchase/suppliers').then(function(r){ return r.json(); }).then(function(d){
    if (d.success) { supplierRows = d.data; renderSuppliers(d.data); }
  });
}
function renderSuppliers(rows){
  supplierRows = rows || [];
  supplierMap = {};
  supplierRows.forEach(function(s){ supplierMap[s.name] = s; });
  if (!supplierRows.length) { $('supplierList').innerHTML = '<div class="empty">还没有供应商，上面填一条保存即可</div>'; return; }
  $('supplierList').innerHTML = supplierRows.map(function(s){
    var meta = [s.contact, s.phone, s.category, s.default_invoice, s.note].filter(Boolean).join(' · ');
    var stat = s.used_cnt ? (s.used_cnt + '笔 / ' + fmt(s.used_total) + ' / 未付 ' + fmt(s.used_unpaid)) : '暂无采购记录';
    return '<div class="cfg-item' + (s.active ? '' : ' off') + '">'
      + '<div class="grow"><div class="nm">' + esc(s.name)

  $('syncWrap').style.display = 'none';

function editSupplier(id){
  var s = supplierRows.find(function(x){ return x.id === id; });

  editSid = id;

function saveSupplier(){
  var payload = {
    name: $('sName').value.trim(), contact: $('sContact').value.trim(),
    phone: $('sPhone').value.trim(), category: $('sCategory').value.trim(),
    default_invoice: $('sInvoice').value, note: $('sNote').value.trim(), active: 1
  };
  if (!payload.name) { toast('供应商名称不能为空'); return; }
  if (editSid) payload.sync_history = $('sSync').checked ? 1 : 0;
  var url = editSid ? '/api/purchase/suppliers/' + editSid : '/api/purchase/suppliers';
  fetch(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) })
    .then(function(r){ return r.json(); }).then(function(d){
      if (!d.success) { toast(d.error || '保存失败'); return; }

function toggleSupplier(id, active){
  var s = supplierRows.find(function(x){ return x.id === id; });
  if (!s) return;
  fetch('/api/purchase/suppliers/' + id, { method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ name: s.name, contact: s.contact, phone: s.phone, category: s.category,
                           default_invoice: s.default_invoice, note: s.note, active: active ? 0 : 1 }) })
    .then(function(r){ return r.json(); }).then(function(d){
      if (d.success) { toast(active ? '已停用' : '已启用'); loadSuppliers(); loadOptions(); }
      else toast(d.error || '操作失败');
    });
}
function delSupplier(id){
  if (!confirm('删除该供应商？（已有采购记录的供应商只能停用，不能删除）')) return;
  fetch('/api/purchase/suppliers/' + id, { method: 'DELETE' }).then(function(r){ return r.json(); }).then(function(d){
    if (d.success) { toast('已删除'); loadSuppliers(); loadOptions(); }
    else alert(d.error || '删除失败');
  });
}

  fetch(url, { method: 'POST', headers: {'Content-Type':'application/json'},
              body: JSON.stringify({ kind: cfgTab, name: name }) })
    .then(function(r){ return r.json(); }).then(function(d){
      if (!d.success) { toast(d.error || '保存失败'); return; }
      toast(editDid ? '已更新' : '已添加');
      resetDictForm(); loadDicts(); loadOptions();
    });
}
function delDict(id){
  if (!confirm('删除该条目？（历史采购记录里的文字不受影响）')) return;
  fetch('/api/purchase/dicts/' + id, { method: 'DELETE' }).then(function(r){ return r.json(); }).then(function(d){
    if (d.success) { toast('已删除'); loadDicts(); loadOptions(); }
    else toast(d.error || '删除失败');
  });
}

// 采购表单里选供应商时带出默认设置
document.addEventListener('input', function(e){ if (e.target.id === 'mSupplier') applySupplierPreset(); });

/* ==================== 对账报表 ==================== */
function reconQs(){
  var p = new URLSearchParams();
  if ($('rSupplier').value) p.set('supplier', $('rSupplier').value);
  if ($('rStart').value) p.set('start', $('rStart').value);
  if ($('rEnd').value) p.set('end', $('rEnd').value);
  return p.toString();
}
function openRecon(){
  $('reconModal').classList.add('show');
  fillSelect($('rSupplier'), (opts.suppliers || []), '全部供应商');
  if (!$('rStart').value && !$('rEnd').value) {
    var now = new Date();
    $('rStart').value = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-01';
    $('rEnd').value = now.toISOString().slice(0, 10);
  }
  runRecon();
}
function closeRecon(){ $('reconModal').classList.remove('show'); }
function printRecon(){ if (!$('reconArea').innerHTML.trim()) { toast('先生成对账单'); return; } window.print(); }
function exportRecon(){ window.open('/api/purchase/reconcile/export?' + reconQs(), '_blank'); }
function runRecon(){
  fetch('/api/purchase/reconcile?' + reconQs()).then(function(r){ return r.json(); }).then(function(d){
    if (!d.success) { $('reconArea').innerHTML = '<div class="empty">' + esc(d.error || '生成失败') + '</div>'; return; }
    renderRecon(d.data);
  });
}
function renderRecon(d){
  var s = d.summary, o = d.outstanding;
  var prof = d.profile;
  var head = '<div class="recon-head">'
    + '<span class="t">采购对账单</span>'
    + '<span>供应商：<b>' + esc(d.supplier || '全部供应商') + '</b></span>'
    + (prof && prof.contact ? '<span>联系人：' + esc(prof.contact) + '</span>' : '')
    + (prof && prof.phone ? '<span>电话：' + esc(prof.phone) + '</span>' : '')
    + '<span>期间：' + esc((d.start || '最早') + ' 至 ' + (d.end || '最新')) + '</span>'
    + '<span style="color:var(--text-secondary)">生成时间：' + esc(d.generated_at) + '</span></div>';
  var cards = [['笔数', s.count], ['采购总额', fmt(s.total)], ['进项税额', fmt(s.tax)],
               ['不含税成本', fmt(s.net_cost)], ['已开票', fmt(s.invoiced)],
               ['待开票', fmt(s.uninvoiced)], ['已付', fmt(s.paid)],
               ['本期未付', fmt(s.unpaid)],
               ['对账进度', s.recon_cnt + '/' + s.count]]
    .map(function(c){ return '<div class="stat-card"><div class="s-label">' + c[0] + '</div><div class="s-value">' + c[1] + '</div></div>'; }).join('');
  var rows = (d.items || []).map(function(r){
    return '<tr><td>' + esc(r.date) + '</td><td>' + esc(r.bill_no) + '</td>'
      + '<td>' + esc(r.category) + '</td><td>' + esc(r.summary) + '</td>'
      + '<td>' + esc(r.invoice_type) + '</td><td class="num">' + fmt(r.total_amount) + '</td>'
      + '<td class="num">' + fmt(r.input_tax) + '</td><td class="num">' + fmt(r.invoiced_amount) + '</td>'
      + '<td class="num">' + fmt(r.paid_amount) + '</td><td class="num">' + fmt(r.unpaid_balance) + '</td>'
      + '<td>' + statusBadge(r.pay_status) + '</td>'
      + '<td>' + (r.reconciled
          ? '<span class="tag-recon">已对账</span> <button class="btn-outline btn-sm" onclick="markRecon(' + r.id + ',0)">撤销</button>'
          : '<span class="tag-unrecon">未对账</span> <button class="btn-outline btn-sm" onclick="markRecon(' + r.id + ',1)">核对</button>')
      + '</td></tr>';
  }).join('');
  var foot = '<tfoot><tr><td colspan="5">合计 ' + (d.items || []).length + ' 笔</td>'
    + '<td class="num">' + fmt(s.total) + '</td><td class="num">' + fmt(s.tax) + '</td>'
    + '<td class="num">' + fmt(s.invoiced) + '</td><td class="num">' + fmt(s.paid) + '</td>'
    + '<td class="num">' + fmt(s.unpaid) + '</td><td colspan="2"></td></tr></tfoot>';
  var tbl = '<div style="overflow-x:auto"><table class="recon-tbl"><thead><tr>'
    + '<th>日期</th><th>单据号</th><th>品类</th><th>摘要</th><th>发票类型</th>'
    + '<th class="num">采购额</th><th class="num">进项税</th><th class="num">已开票</th>'
    + '<th class="num">已付</th><th class="num">未付</th><th>状态</th><th>对账</th>'
    + '</tr></thead><tbody>' + (rows || '<tr><td colspan="12" class="empty">该期间没有采购记录</td></tr>')
    + '</tbody>' + foot + '</table></div>';
  var sub = '<div class="recon-cards"><div class="stat-card"><div class="s-label">累计未付（全部历史）</div>'
    + '<div class="s-value warn">' + fmt(o.unpaid) + '</div>'
    + '<div class="s-label">累计采购 ' + fmt(o.total) + ' / 已付 ' + fmt(o.paid) + ' / ' + o.count + ' 笔</div></div></div>';
  var byInv = (d.by_invoice || []).length ? '<div class="s-label" style="margin-top:8px">按发票类型：'
    + d.by_invoice.map(function(r){ return esc(r.invoice_type) + ' ' + fmt(r.total); }).join(' · ') + '</div>' : '';
  var byMonth = (d.by_month || []).length ? '<div class="s-label">按月小计：'
    + d.by_month.map(function(r){ return esc(r.period) + ' ' + fmt(r.total); }).join(' · ') + '</div>' : '';
  $('reconArea').innerHTML = head + '<div class="recon-cards">' + cards + '</div>' + tbl + sub + byInv + byMonth;
}
function markRecon(id, flag){
  fetch('/api/purchase/records/' + id + '/reconcile', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ reconciled: flag })
  }).then(function(r){ return r.json(); }).then(function(d){
    if (!d.success) { toast(d.error || '操作失败'); return; }
    toast(flag ? '已标记对账' : '已撤销对账');
    runRecon(); reload();
  });
}

loadOptions();
reload();
</script>
