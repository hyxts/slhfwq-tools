<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="记事本">
<meta name="theme-color" content="#6366f1">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%236366f1'/><text x='16' y='23' text-anchor='middle' font-size='16' font-weight='bold' fill='white' font-family='sans-serif'>N</text></svg>">
<title>记事本</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
button,input,textarea,select{font:inherit;color:inherit}
html,body{width:100%;height:100vh;height:100dvh}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:#f8fafc;color:#1e293b;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overflow:hidden;
}

/* Header */
.header{
  background:#ffffff;padding:8px 14px;
  padding-top:calc(8px + env(safe-area-inset-top));
  padding-left:calc(14px + env(safe-area-inset-left));
  padding-right:calc(14px + env(safe-area-inset-right));
  position:relative;z-index:100;
  border-bottom:1px solid #e2e8f0;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
  min-height:48px;
}
.header .left{display:flex;align-items:center;gap:6px}
.header .back{
  color:#64748b;text-decoration:none;font-size:20px;
  display:inline-flex;align-items:center;justify-content:center;
  min-width:36px;min-height:36px;border-radius:8px;font-weight:400;
}
.header .title{
  font-weight:700;font-size:17px;color:#6366f1;
  display:flex;align-items:center;gap:5px;
}
.header .right{display:flex;align-items:center;gap:4px}
.header .btn{
  padding:6px 10px;border:1px solid #e2e8f0;border-radius:8px;
  background:#fff;color:#475569;font-size:12px;font-weight:600;
  cursor:pointer;min-height:34px;display:flex;align-items:center;gap:4px;
  transition:all 0.15s;
}
.header .btn:active{background:#f1f5f9;border-color:#cbd5e1}
.header .btn.pin{color:#6366f1;border-color:#c7d2fe;background:#eef2ff}
.header .btn.danger{color:#dc2626}

/* Mobile toggle */
.menu-toggle{
  display:none;width:36px;height:36px;border-radius:8px;
  border:1px solid #e2e8f0;background:#fff;color:#475569;
  font-size:16px;font-weight:600;cursor:pointer;
  align-items:center;justify-content:center;
}

/* Layout */
.layout{
  display:flex;height:calc(100vh - 48px);height:calc(100dvh - 48px);
}
.sidebar{
  width:260px;min-width:260px;background:#ffffff;
  border-right:1px solid #e2e8f0;
  display:flex;flex-direction:column;
  padding:8px;overflow:hidden;
  transition:transform 0.25s ease;
}
.main-area{
  flex:1;display:flex;flex-direction:column;
  background:#ffffff;overflow:hidden;
}

/* Sidebar search */
.side-search{
  padding:4px;margin-bottom:4px;
}
.side-search input{
  width:100%;padding:8px 12px;border:1px solid #e2e8f0;
  border-radius:10px;font-size:14px;background:#f8fafc;
  min-height:36px;outline:none;
}
.side-search input:focus{border-color:#6366f1;background:#fff;box-shadow:0 0 0 3px rgba(99,102,241,.1)}

/* Sidebar list */
.note-list{
  flex:1;overflow-y:auto;padding:2px;
  -webkit-overflow-scrolling:touch;
}
.note-item{
  padding:10px 12px;border-radius:10px;cursor:pointer;
  transition:all 0.12s;margin-bottom:2px;position:relative;
}
.note-item:active{background:#f1f5f9}
.note-item.active{background:#eef2ff}
.note-item .ni-title{
  font-size:14px;font-weight:600;color:#1e293b;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  display:flex;align-items:center;gap:4px;
}
.note-item .ni-pin{color:#6366f1;font-size:12px;flex-shrink:0}
.note-item .ni-preview{
  font-size:12px;color:#94a3b8;margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.note-item .ni-time{
  font-size:10px;color:#cbd5e1;margin-top:2px;
}
.note-item.active .ni-title{color:#4338ca}
.note-item.active .ni-preview{color:#a5b4fc}

/* Empty sidebar */
.side-empty{
  text-align:center;padding:40px 16px;color:#94a3b8;font-size:13px;
}

/* Main area - empty state */
.main-empty{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;color:#cbd5e1;gap:12px;
  padding:40px;
}
.main-empty .big{font-size:56px;font-weight:200}
.main-empty .msg{font-size:14px;color:#94a3b8}

/* Main editor */
.editor{
  flex:1;display:flex;flex-direction:column;padding:16px 20px;overflow:auto;
}
.editor-title{
  font-size:20px;font-weight:700;border:none;outline:none;
  padding:4px 0;margin-bottom:12px;color:#1e293b;
  background:transparent;width:100%;
  min-height:38px;
}
.editor-title::placeholder{color:#cbd5e1}
.editor-content{
  flex:1;border:none;outline:none;resize:none;
  font-size:15px;line-height:1.7;color:#475569;
  background:transparent;width:100%;
  min-height:200px;
}
.editor-content::placeholder{color:#d1d5db}
.editor-meta{
  font-size:11px;color:#cbd5e1;padding-top:12px;
  border-top:1px solid #f1f5f9;margin-top:12px;
}

/* Confirm */
.confirm-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  display:none;align-items:center;justify-content:center;z-index:2000;
}
.confirm-overlay.show{display:flex}
.confirm-box{
  background:#fff;border-radius:16px;width:90%;max-width:320px;
  padding:28px 24px 20px;text-align:center;
  box-shadow:0 8px 30px rgba(0,0,0,.12);
}
.confirm-box .ct{font-size:17px;font-weight:700;margin-bottom:8px;color:#1e293b}
.confirm-box .cm{font-size:13px;color:#64748b;margin-bottom:24px}
.confirm-btns{display:flex;gap:10px}
.confirm-btns button{flex:1;padding:10px;border-radius:10px;font-size:14px;font-weight:600;min-height:44px;border:none;cursor:pointer}
.btn-cancel{background:#e2e8f0;color:#475569}
.btn-danger{background:#dc2626;color:#fff}

/* Toast */
.toast{
  position:fixed;top:60px;left:50%;transform:translateX(-50%);
  background:#1e293b;color:#fff;padding:8px 20px;
  border-radius:20px;font-size:13px;font-weight:500;z-index:3000;
  opacity:0;transition:opacity 0.3s;pointer-events:none;
  box-shadow:0 4px 12px rgba(0,0,0,.15);
}
.toast.show{opacity:1}

/* Mobile responsive */
@media(max-width:640px){
  .layout{position:relative}
  .sidebar{
    position:absolute;top:0;left:0;bottom:0;z-index:50;
    max-width:280px;box-shadow:4px 0 20px rgba(0,0,0,.1);
    transform:translateX(-100%);
  }
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:flex}
  .editor{padding:12px 16px}
  .editor-title{font-size:18px}
}
@media(min-width:768px){
  .sidebar{width:280px;min-width:280px}
}
</style>
</head>
<body>

<div class="header">
  <div class="left">
    <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()" title="笔记列表">=</button>
    <a class="back" href="/nav" title="返回导航" onclick="if(document.referrer.includes('/nav')){history.back();return false}">←</a>
    <div class="title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V7.5L14.5 2z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/>
      </svg>
      记事本
    </div>
  </div>
  <div class="right" id="toolbar">
    <button class="btn" onclick="newNote()" title="新建笔记">新建</button>
    <button class="btn pin" id="pinBtn" onclick="togglePin()" style="display:none" title="切换置顶">置顶</button>
    <button class="btn danger" id="delBtn" onclick="confirmDel()" style="display:none" title="删除">删除</button>
  </div>
</div>

<div class="layout">
  <div class="sidebar" id="sidebar">
    <div class="side-search">
      <input type="text" id="sideSearch" placeholder="搜索笔记..." oninput="onSearch()" autocomplete="off">
    </div>
    <div class="note-list" id="noteList">
      <div class="side-empty">点击「新建」开始记录</div>
    </div>
  </div>

  <div class="main-area" id="mainArea">
    <div class="main-empty" id="emptyState">
      <div class="big">-</div>
      <div class="msg">选择一篇笔记，或点击上方「新建」开始记录</div>
    </div>
    <div class="editor" id="editor" style="display:none">
      <input type="text" class="editor-title" id="editTitle" placeholder="标题" maxlength="200">
      <textarea class="editor-content" id="editContent" placeholder="开始写点什么..." maxlength="50000"></textarea>
      <div class="editor-meta" id="editMeta"></div>
    </div>
  </div>
</div>

<!-- 确认删除 -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="ct">确认删除</div>
    <div class="cm" id="confirmMsg">确定要删除该笔记吗？</div>
    <div class="confirm-btns">
      <button class="btn-cancel" onclick="closeConfirm()">取消</button>
      <button class="btn-danger" onclick="execDelete()">删除</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var API='/api/notepad';
var notes=[], currentNote=null, saveTimer=null, isDirty=false, deleteId=null;

function qs(s){return document.querySelector(s)}
function qid(s){return document.getElementById(s)}
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

/* ===== 格式化时间 ===== */
function fmtTime(dt){
  if(!dt)return'';
  var d=new Date(dt.replace(' ','T')+'+08:00');
  var now=new Date();
  var diff=now-d;
  if(diff<60000)return'刚刚';
  if(diff<3600000)return Math.floor(diff/60000)+'分钟前';
  if(diff<86400000)return Math.floor(diff/3600000)+'小时前';
  var y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+dd;
}

/* ===== Toast ===== */
function showToast(msg){
  var t=qid('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(t._tid);
  t._tid=setTimeout(function(){t.classList.remove('show')},1800);
}

/* ===== 加载列表 ===== */
function loadList(keepSelection){
  var kw=(qid('sideSearch')||{}).value||'';
  fetch(API+'/list'+(kw?'?search='+encodeURIComponent(kw):''))
    .then(function(r){return r.json()})
    .then(function(res){
      if(res.success){
        notes=res.data||[];
        renderList();
        if(keepSelection&&currentNote){
          var found=notes.find(function(n){return n.id===currentNote.id});
          if(found)currentNote=found;
          else clearEditor();
        }
      }
    }).catch(function(){});
}

/* ===== 渲染列表 ===== */
function renderList(){
  var el=qid('noteList');
  if(!notes.length){
    el.innerHTML='<div class="side-empty">暂无笔记</div>';
    return;
  }
  el.innerHTML=notes.map(function(n){
    var cls=n.id===((currentNote||{}).id)&&'active'||'';
    var pinHtml=n.pinned?'<span class="ni-pin">*</span>':'';
    return '<div class="note-item '+cls+'" onclick="selectNote('+n.id+')">'+
      '<div class="ni-title">'+pinHtml+esc(n.title||'未命名笔记')+'</div>'+
      '<div class="ni-preview">'+(n.preview||'空白笔记')+'</div>'+
      '<div class="ni-time">'+fmtTime(n.updated_at)+'</div>'+
    '</div>';
  }).join('');
}

/* ===== 选择笔记 ===== */
function selectNote(id){
  fetch(API+'/'+id).then(function(r){return r.json()}).then(function(res){
    if(res.success){
      currentNote=res.data;
      showEditor();
      qid('editTitle').value=currentNote.title||'';
      qid('editContent').value=currentNote.content||'';
      qid('editMeta').textContent='创建于 '+fmtTime(currentNote.created_at)+' · 更新于 '+fmtTime(currentNote.updated_at);
      qid('pinBtn').style.display='inline-flex';
      qid('delBtn').style.display='inline-flex';
      updatePinBtn();
      renderList();
      isDirty=false;
      closeSidebar();
      setTimeout(function(){qid('editContent').focus()},100);
    }else{
      showToast('笔记不存在');
    }
  }).catch(function(){});
}

/* ===== 新建 ===== */
function newNote(){
  fetch(API+'/create',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({title:'未命名笔记',content:''})
  }).then(function(r){return r.json()}).then(function(res){
    if(res.success){
      currentNote=res.data;
      showEditor();
      qid('editTitle').value='';
      qid('editContent').value='';
      qid('editMeta').textContent='新建中...';
      qid('pinBtn').style.display='inline-flex';
      qid('delBtn').style.display='inline-flex';
      updatePinBtn();
      loadList();
      isDirty=false;
      closeSidebar();
      setTimeout(function(){qid('editTitle').focus()},100);
    }
  }).catch(function(){});
}

/* ===== 显示/隐藏编辑器 ===== */
function showEditor(){
  qid('emptyState').style.display='none';
  qid('editor').style.display='flex';
}
function clearEditor(){
  currentNote=null;
  qid('emptyState').style.display='flex';
  qid('editor').style.display='none';
  qid('pinBtn').style.display='none';
  qid('delBtn').style.display='none';
  renderList();
  isDirty=false;
}

/* ===== 自动保存（防抖） ===== */
function scheduleSave(){
  isDirty=true;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(doSave,800);
}
function doSave(){
  if(!currentNote||!isDirty)return;
  isDirty=false;
  var title=qid('editTitle').value;
  var content=qid('editContent').value;
  fetch(API+'/'+currentNote.id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({title:title,content:content})
  }).then(function(r){return r.json()}).then(function(res){
    if(res.success){
      currentNote=res.data;
      qid('editMeta').textContent='创建于 '+fmtTime(currentNote.created_at)+' · 更新于 '+fmtTime(currentNote.updated_at);
      loadList(true);
      showToast('已自动保存');
    }
  }).catch(function(){});
}

qid('editTitle').addEventListener('input',scheduleSave);
qid('editContent').addEventListener('input',scheduleSave);

/* ===== 切换置顶 ===== */
function togglePin(){
  if(!currentNote)return;
  fetch(API+'/'+currentNote.id+'/pin',{method:'PUT'}).then(function(r){return r.json()}).then(function(res){
    if(res.success){
      currentNote.pinned=res.data.pinned;
      updatePinBtn();
      showToast(currentNote.pinned?'已置顶':'已取消置顶');
      loadList(true);
    }
  }).catch(function(){});
}
function updatePinBtn(){
  var btn=qid('pinBtn');
  if(currentNote&&currentNote.pinned){
    btn.textContent='取消置顶';btn.style.background='#eef2ff';
  }else{
    btn.textContent='置顶';btn.style.background='#fff';
  }
}

/* ===== 删除确认 ===== */
function confirmDel(){
  if(!currentNote)return;
  deleteId=currentNote.id;
  qid('confirmMsg').textContent='确定删除「'+(currentNote.title||'未命名笔记')+'」？';
  qid('confirmOverlay').classList.add('show');
}
function execDelete(){
  if(!deleteId)return;
  fetch(API+'/'+deleteId,{method:'DELETE'}).then(function(r){return r.json()}).then(function(res){
    if(res.success){
      closeConfirm();
      showToast('已删除');
      clearEditor();
      loadList();
    }
  }).catch(function(){});
}
function closeConfirm(){
  qid('confirmOverlay').classList.remove('show');
  deleteId=null;
}

/* ===== 搜索 ===== */
var searchTimer=null;
function onSearch(){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(function(){loadList(true)},300);
}

/* ===== 侧边栏 ===== */
function toggleSidebar(){
  qid('sidebar').classList.toggle('open');
}
function closeSidebar(){
  qid('sidebar').classList.remove('open');
}

/* ===== 快捷键 ===== */
document.addEventListener('keydown',function(e){
  if((e.ctrlKey||e.metaKey)&&e.key==='s'){
    e.preventDefault();
    if(currentNote){clearTimeout(saveTimer);doSave()}
  }
  if((e.ctrlKey||e.metaKey)&&e.key==='n'){
    e.preventDefault();
    newNote();
  }
});

/* ===== 页面关闭前保存 ===== */
window.addEventListener('beforeunload',function(){
  if(isDirty&&currentNote)doSave();
});

/* ===== 点击侧边栏外部关闭 ===== */
document.addEventListener('click',function(e){
  var sidebar=qid('sidebar');
  if(sidebar.classList.contains('open')&&!sidebar.contains(e.target)&&e.target!==qid('menuToggle')){
    closeSidebar();
  }
});

/* ===== 初始加载 ===== */
loadList();
</script>
</body>
</html>
