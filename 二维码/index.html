<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>挪车电话码</title>
<link rel="icon" type="image/svg+xml" href="/qrcode/icon-192.svg">
<link rel="manifest" href="/qrcode/manifest.json">
<meta name="theme-color" content="#059669">
<style>
:root{--primary:#059669;--primary-l:#ecfdf5;--bg:#f0f2f5;--card-bg:#ffffff;--text:#1e293b;
      --text-secondary:#64748b;--border:#e2e8f0;--shadow:0 2px 8px rgba(0,0,0,.06);--danger:#dc2626}
*{margin:0;padding:0;box-sizing:border-box}
body{padding-top:env(safe-area-inset-top);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);
     padding-bottom:calc(16px + env(safe-area-inset-bottom));background:var(--bg);color:var(--text);font-size:15px;
     font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:#ffffff;z-index:101;pointer-events:none}
header{background:#ffffff;border-bottom:1px solid var(--border);padding:12px 16px;position:sticky;top:0;z-index:100;
       display:flex;align-items:center;justify-content:space-between}
header .ttl{font-size:17px;font-weight:600}
main{max-width:900px;margin:0 auto;padding:12px}
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.ttl2{font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:10px}
label{display:block;font-size:13px;color:var(--text-secondary);margin:10px 0 5px}
input,select{width:100%;border:1px solid var(--border);border-radius:10px;padding:10px 12px;min-height:44px;
             font-size:16px;font-family:inherit;color:var(--text);background:#fff}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(5,150,105,.12)}
.hint{font-size:12px;color:var(--text-secondary);line-height:1.6;margin-top:8px}
.check{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px;color:var(--text-secondary);min-height:44px}
.check input{width:20px;height:20px;min-height:20px;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{min-height:36px;padding:0 12px;border:1px solid var(--border);background:#fff;border-radius:18px;
      color:var(--text-secondary);font-size:14px;font-family:inherit;cursor:pointer}
.chip:active{background:var(--primary-l)}
.qrbox{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px;display:flex;
       align-items:center;justify-content:center;min-height:260px}
.qrbox svg{width:100%;max-width:320px;height:auto;display:block;border-radius:10px}
.qrbox .ph{color:var(--text-secondary);font-size:13px;text-align:center;line-height:1.7}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--text-secondary);margin-top:10px}
.err{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.acts button{flex:1;min-width:100px;min-height:44px;border:none;border-radius:10px;padding:10px 16px;font-weight:600;
             font-size:15px;font-family:inherit;cursor:pointer;background:#e2e8f0;color:var(--text)}
.acts button:active{opacity:.85}
.btn-primary{background:var(--primary);color:#fff}
.tip{background:var(--primary-l);border-radius:10px;padding:10px 12px;margin-top:12px;font-size:12px;
     color:#065f46;line-height:1.7}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #f1f5f9}
.row:last-child{border-bottom:none}
.row .l{flex:1;min-width:0}
.row .n{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .s{font-size:12px;color:var(--text-secondary);margin-top:3px}
.row .rm{flex:none;min-width:44px;min-height:44px;border:1px solid var(--border);background:#fff;border-radius:9px;
         color:var(--danger);font-size:13px;font-family:inherit;cursor:pointer}
.empty{text-align:center;color:var(--text-secondary);font-size:13px;padding:20px 0}
@media (max-width:768px){
  .card{border-radius:10px;padding:14px}
  .acts button{min-width:calc(50% - 5px)}
}
</style>
</head>
<body>
<header>
  <div style="display:flex;align-items:center;gap:8px">
    <a href="/nav" title="返回导航"
       style="color:#64748b;text-decoration:none;font-size:20px;font-weight:400;
              line-height:1;display:inline-flex;align-items:center;
              justify-content:center;min-width:44px;min-height:44px;
              border-radius:8px"
       onclick="if(document.referrer.includes('/nav')){history.back();return false}">←</a>
    <span class="ttl">挪车电话码</span>
  </div>
</header>

<main>
  <section class="card">
    <div class="ttl2">二维码预览</div>
    <div class="qrbox" id="qrBox">
      <div class="ph">填写下方手机号后<br>自动生成挪车二维码</div>
    </div>
    <div class="meta" id="metaBox" style="display:none">
      <span id="metaTel"></span>
      <span id="metaInfo"></span>
    </div>
    <div class="err" id="errBox"></div>
    <div class="acts">
      <button class="btn-primary" id="btnPng">保存图片</button>
    </div>
    <div class="tip">微信 / 相机扫一扫，打开页面后自动呼出拨号；二维码下方不印号码，避免被拍照滥用。</div>
  </section>

  <section class="card">
    <div class="ttl2">号码与文案</div>
    <label for="phoneInput">手机号码</label>
    <input id="phoneInput" type="tel" inputmode="numeric" maxlength="16" placeholder="如 13800138000" autocomplete="off">
    <div class="hint">号码只取数字，不会加 +86 区号。</div>

    <label for="titleInput">二维码标题</label>
    <input id="titleInput" type="text" maxlength="12" placeholder="如 扫描挪车" autocomplete="off">
    <div class="chips" id="titleChips">
      <button class="chip" data-t="扫描挪车">扫描挪车</button>
      <button class="chip" data-t="扫码呼叫车主">扫码呼叫车主</button>
      <button class="chip" data-t="临时停车">临时停车</button>
      <button class="chip" data-t="请多关照">请多关照</button>
    </div>

    <label for="hintInput">底部提示（可留空）</label>
    <input id="hintInput" type="text" maxlength="24" placeholder="如 扫码后点击「呼叫」" autocomplete="off">
    <div class="chips" id="hintChips">
      <button class="chip" data-h="扫我呼叫车主">扫我呼叫车主</button>
      <button class="chip" data-h="扫码后点击「呼叫」">扫码后点击「呼叫」</button>
      <button class="chip" data-h="临时停车 · 请多关照">临时停车 · 请多关照</button>
    </div>
  </section>

  <section class="card">
    <div class="ttl2">参数</div>
    <label for="levelSel">纠错等级</label>
    <select id="levelSel">
      <option value="M">M — 约 15%（推荐）</option>
      <option value="Q">Q — 约 25%</option>
      <option value="H" selected>H — 约 30%（贴车窗推荐）</option>
    </select>
    <label for="scaleSel">图片大小</label>
    <select id="scaleSel">
      <option value="8">小（约 260px）</option>
      <option value="10" selected>中（约 320px）</option>
      <option value="14">大（约 450px）</option>
      <option value="18">超大（约 580px）</option>
    </select>
    <div class="hint">贴在前挡风玻璃上建议选 H 级纠错并过塑，隔着玻璃反光也能扫出来。</div>
  </section>

  <section class="card">
    <div class="ttl2">最近生成</div>
    <div id="histList"></div>
  </section>
</main>

<script>
var $ = function(id){ return document.getElementById(id); };
var state = { level:'H', scale:10, border:4, svg:'', phone:'', tel:'' };
var HIST_KEY = 'qrcode_phone_history_v4';
var PREF_KEY = 'qrcode_phone_pref_v5';

/* ---------- 号码处理 ---------- */
function rawPhone(){
  return ($('phoneInput').value || '').replace(/\D/g, '');
}
function normPhone(){                 /* 不加区号：就是输入框里的数字 */
  return rawPhone();
}
function digits11(p){
  var d = (p || '').replace(/\D/g, '');
  return d.length > 11 ? d.slice(-11) : d;
}
function fmtMask(p){
  var d = digits11(p);
  return d.length === 11 ? d.slice(0,3) + ' **** ' + d.slice(7) : p;
}
function validPhone(){
  return /^\d{6,15}$/.test(rawPhone());
}

/* ---------- 生成 ---------- */
var timer = null;
function schedule(){
  clearTimeout(timer);
  timer = setTimeout(render, 300);
}
async function render(){
  var p = rawPhone();
  if (!p){
    resetBox('填写下方手机号后<br>自动生成挪车二维码');
    return;
  }
  if (!validPhone()){
    resetBox('号码格式不正确<br>请填写 6~15 位数字');
    $('errBox').textContent = '请输入正确的手机号码（6~15 位数字）';
    return;
  }
  var body = {
    phone:p, level:state.level, scale:state.scale, border:state.border, fmt:'svg',
    title:($('titleInput').value || '').trim(),
    hint:($('hintInput').value || '').trim()
  };
  try{
    var res = await fetch('/api/qrcode', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body)
    });
    if (!res.ok){
      var j = await res.json().catch(function(){ return {}; });
      $('errBox').textContent = j.error || ('生成失败（' + res.status + '）');
      return;
    }
    var svg = await res.text();
    $('qrBox').innerHTML = svg;
    state.svg = svg;
    state.phone = p;
    state.tel = 'tel:' + normPhone();
    $('errBox').textContent = '';
    $('metaBox').style.display = 'flex';
    $('metaTel').textContent = '拨打 ' + state.tel;
    $('metaInfo').textContent = '纠错等级 ' + state.level;
  }catch(e){
    $('errBox').textContent = '网络异常，请重试';
  }
}
function resetBox(html){
  $('qrBox').innerHTML = html ? '<div class="ph">' + html + '</div>' : $('qrBox').innerHTML;
  state.svg = ''; state.phone = ''; state.tel = '';
  $('metaBox').style.display = 'none';
  if (html) $('errBox').textContent = '';
}

/* ---------- 保存 / 下载 ---------- */
function saveBlob(blob, filename){
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function svgToPngBlob(svg){
  /* 把带文字的 SVG 画到 canvas 再导出 PNG：标准库后端画不出中文，前端合成 */
  return new Promise(function(resolve, reject){
    var img = new Image();
    var url = URL.createObjectURL(new Blob([svg], { type:'image/svg+xml;charset=utf-8' }));
    img.onload = function(){
      var ratio = 3;
      var w = img.width || 320, h = img.height || 320;
      var cv = document.createElement('canvas');
      cv.width = Math.round(w * ratio);
      cv.height = Math.round(h * ratio);
      var ctx = cv.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(function(b){ b ? resolve(b) : reject(new Error('toBlob 失败')); }, 'image/png');
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error('SVG 加载失败')); };
    img.src = url;
  });
}
async function savePng(){
  if (!state.svg){ alert('请先填写手机号'); return; }
  try{
    saveBlob(await svgToPngBlob(state.svg), 'nuoche-' + state.phone + '.png');
    pushHistory();
  }catch(e){
    try{                                   // 兜底：直接下后端生成的纯码 PNG
      var res = await fetch('/api/qrcode', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({ phone:state.phone, level:state.level, scale:state.scale,
                              border:state.border, fmt:'png' })
      });
      if (!res.ok) throw new Error('png');
      saveBlob(await res.blob(), 'nuoche-' + state.phone + '.png');
      pushHistory();
    }catch(e2){ alert('保存失败，请重试'); }
  }
}
/* ---------- 历史记录 ---------- */
function getHist(){
  try{ return JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); }
  catch(e){ return []; }
}
function setHist(list){
  try{ localStorage.setItem(HIST_KEY, JSON.stringify(list.slice(0, 10))); }catch(e){}
}
function pushHistory(){
  if (!state.phone) return;
  var item = { phone:state.phone, title:($('titleInput').value || '').trim(),
               hint:($('hintInput').value || '').trim(), level:state.level, ts:Date.now() };
  var list = getHist().filter(function(x){ return x.phone !== item.phone || x.title !== item.title; });
  list.unshift(item);
  setHist(list);
  renderHist();
}
function renderHist(){
  var list = getHist();
  var box = $('histList');
  if (!list.length){ box.innerHTML = '<div class="empty">暂无记录</div>'; return; }
  box.innerHTML = '';
  list.forEach(function(item, idx){
    var row = document.createElement('div');
    row.className = 'row';
    var l = document.createElement('div');
    l.className = 'l';
    var n = document.createElement('div');
    n.className = 'n';
    n.textContent = (item.title || '电话二维码') + ' · ' + fmtMask(item.phone);
    var s = document.createElement('div');
    s.className = 's';
    var d = new Date(item.ts);
    s.textContent = d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    l.appendChild(n); l.appendChild(s);
    l.onclick = function(){ applyHist(item); };
    var rm = document.createElement('button');
    rm.className = 'rm'; rm.textContent = '删除';
    rm.onclick = function(){
      var cur = getHist();
      cur.splice(idx, 1);
      setHist(cur); renderHist();
    };
    row.appendChild(l); row.appendChild(rm);
    box.appendChild(row);
  });
}
function pad(v){ return v < 10 ? '0' + v : '' + v; }
function applyHist(item){
  $('phoneInput').value = item.phone || '';
  $('titleInput').value = item.title || '';
  $('hintInput').value = item.hint || '';
  if (item.level){ state.level = item.level; $('levelSel').value = item.level; }
  savePref();
  render();
}

/* ---------- 偏好 ---------- */
function savePref(){
  try{
    localStorage.setItem(PREF_KEY, JSON.stringify({
      level:state.level, scale:state.scale,
      title:($('titleInput').value || '').trim(),
      hint:($('hintInput').value || '').trim()
    }));
  }catch(e){}
}
function loadPref(){
  var p = null;
  try{ p = JSON.parse(localStorage.getItem(PREF_KEY) || 'null'); }catch(e){}
  if (!p) return;
  if (p.level){ state.level = p.level; $('levelSel').value = p.level; }
  if (p.scale){ state.scale = parseInt(p.scale, 10) || 10; $('scaleSel').value = String(state.scale); }
  if (p.title) $('titleInput').value = p.title;
  if (p.hint) $('hintInput').value = p.hint;
}

/* ---------- 事件绑定 ---------- */
$('phoneInput').addEventListener('input', schedule);
$('titleInput').addEventListener('input', schedule);
$('hintInput').addEventListener('input', schedule);
$('levelSel').addEventListener('change', function(){ state.level = this.value; savePref(); render(); });
$('scaleSel').addEventListener('change', function(){ state.scale = parseInt(this.value, 10) || 10; savePref(); render(); });
$('btnPng').addEventListener('click', savePng);
var chips = $('titleChips').getElementsByTagName('button');
for (var i = 0; i < chips.length; i++){
  chips[i].addEventListener('click', function(){
    $('titleInput').value = this.getAttribute('data-t');
    savePref(); render();
  });
}
var hchips = $('hintChips').getElementsByTagName('button');
for (var j = 0; j < hchips.length; j++){
  hchips[j].addEventListener('click', function(){
    $('hintInput').value = this.getAttribute('data-h');
    savePref(); render();
  });
}

loadPref();
if (!$('hintInput').value) $('hintInput').value = '扫我呼叫车主';
renderHist();
</script>
</body>
</html>
